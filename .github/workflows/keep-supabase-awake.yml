# Pings the Supabase project every few days so the free plan doesn't pause it for inactivity.
# If Supabase can't be reached (paused, deleted or down), the run fails and GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" config.js)
          key=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" config.js)
          # A database query counts as activity. Signed-out requests are refused by row-level security, which is fine.
          for path in auth/v1/health 'rest/v1/items?select=id&limit=1'; do
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$url/$path" -H "apikey: $key" || true)
            echo "$path -> $code"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "::error::Supabase didn't respond ($code). Restore the project at https://supabase.com/dashboard"
              exit 1
            fi
          done
