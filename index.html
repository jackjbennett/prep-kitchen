<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Kitchen</title>
<meta name="description" content="Meal prep planner: pantry, recipes with nutrition, a prep calendar, fridge portions and grocery lists.">
<meta name="theme-color" content="#2D6A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep Kitchen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#17211C; --ink-2:#56625B; --line:#D5DCD2;
  --accent:#2D6A4A; --accent-ink:#FFFFFF; --accent-soft:#DBEBE0; --butter:#F3D05B;
  --ok:#2A7A4C; --ok-soft:#DCF0E2; --warn:#9A6200; --warn-soft:#FAEDCB; --bad:#B3261E; --bad-soft:#F8DEDB;
  --protein:#3A7CA5; --carbs:#D39A1E; --fat:#C4553D;
  --shadow:0 1px 2px rgba(23,33,28,.06);
  --side:#E6EBE3; --today:#F2F8F3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE7; --ink-2:#9BA79F; --line:#2E3931;
    --accent:#6CC394; --accent-ink:#0D1912; --accent-soft:#1E3829; --butter:#E8C24E;
    --ok:#6CC394; --ok-soft:#1C3325; --warn:#E6B350; --warn-soft:#382C12; --bad:#F2877C; --bad-soft:#3C1C1A;
    --protein:#72B2DA; --carbs:#EDC25A; --fat:#E98B74; --shadow:none;
    --side:#0B0F0D; --today:#1A2720;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE7; --ink-2:#9BA79F; --line:#2E3931;
  --accent:#6CC394; --accent-ink:#0D1912; --accent-soft:#1E3829; --butter:#E8C24E;
  --ok:#6CC394; --ok-soft:#1C3325; --warn:#E6B350; --warn-soft:#382C12; --bad:#F2877C; --bad-soft:#3C1C1A;
  --protein:#72B2DA; --carbs:#EDC25A; --fat:#E98B74; --shadow:none;
  --side:#0B0F0D; --today:#1A2720;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:0;padding-block:0;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px;overflow-y:auto}
.side .brand{padding-inline:8px}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;border:0;background:none;color:var(--ink-2);font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
.navbtn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.navbtn.on svg{color:var(--accent)}
.navbtn .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.navbtn .cnt.warn{color:var(--warn)}
.navbtn .badge{margin-left:auto}
.navsep{height:1px;background:var(--line);margin:6px 10px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-inline:8px;font-size:12.5px;color:var(--ink-2)}
.sidefoot .date{font-weight:700;color:var(--ink);font-size:13px}
.content{padding-inline:32px;padding-block:28px 64px;min-width:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:14px;padding:10px 16px;z-index:10;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .side .brand{padding-inline:0;font-size:18px}
  .nav{flex-direction:row}
  .navsep,.sidefoot{display:none}
  .content{padding-inline:16px;padding-block:18px 48px}
}
/* Today */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.dash .span2{grid-column:span 2}
.dash .span3{grid-column:1 / -1}
@media (max-width:1100px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.dash .span2{grid-column:1 / -1}}
@media (max-width:700px){.dash{grid-template-columns:1fr}}
.gtrack{display:flex;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-block:4px 2px}
.gtrack i{display:block;height:100%}
.todaynums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:620px){.todaynums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tnum{display:flex;flex-direction:column;gap:2px}
.tnum .lbl{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em}
.tnum b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:30px;line-height:1.1}
.tnum b small{font-family:Figtree,sans-serif;font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.tmeal{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tmeal:first-child{border-top:0}
.tmeal .slot{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:700px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sday{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.sday:hover{border-color:var(--ink-2)}
.sday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sday b{font-size:13px}
.sday span{font-size:11.5px;color:var(--ink-2)}
.sday .dots{display:flex;gap:3px;margin-top:4px;min-height:7px}
.sday .dots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sday .dots i.done{background:var(--ink-2);opacity:.5}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-child{border-top:0}
/* Planner grid */
.calwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:104px repeat(7,minmax(128px,1fr));min-width:1000px;background:var(--line);gap:1px}
.cal > div{background:var(--surface);padding:8px;min-width:0}
.cal .ch{background:var(--surface-2);display:flex;flex-direction:column;gap:1px}
.cal .ch b{font-size:13.5px}
.cal .ch span{font-size:11.5px;color:var(--ink-2)}
.cal .ch.today{background:var(--accent);color:var(--accent-ink)}
.cal .ch.today span{color:var(--accent-ink);opacity:.85}
.cal .rh{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:flex-start}
.cal .cell{display:flex;flex-direction:column;gap:6px;min-height:92px}
.cal .cell.today{background:var(--today)}
.cal .cell.past{background:var(--bg)}
.cal .cell.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.cal .tot{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2)}
.cal .tot b{color:var(--ink);font-size:13px;display:block}
.celladd{margin-top:auto;align-self:flex-start;opacity:.55}
.cell:hover .celladd,.celladd:focus-visible{opacity:1}
.rsearch{width:100%}
.cal .meal .slot{display:none}
.cal .meal{background:var(--surface);border-color:var(--line)}
.cal .cell.today .meal,.cal .cell.past .meal{background:var(--surface)}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:28px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;letter-spacing:-.01em}
h3{font-size:15px}
p{margin:0}
.sub{color:var(--ink-2);margin-top:4px;max-width:64ch}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--butter);border:2px solid var(--side)}
.savestate{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--warn)} .dot.off{background:var(--bad)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;line-height:1;padding:3px 6px;font-weight:700}
main{display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card > h2{margin-bottom:10px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{align-items:flex-end}
.spacer{flex:1}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.cols2{grid-template-columns:1fr}}
button{font:inherit}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px Figtree,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.step{width:30px;height:32px;padding:0;display:inline-grid;place-items:center;font-size:17px;line-height:1}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:110px;resize:vertical}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:400}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.w-name{width:200px}.w-num{width:84px}.w-unit{width:78px}.w-date{width:150px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.empty{color:var(--ink-2);padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;font-size:14px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}

/* Pantry */
.statrow{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-2);font-weight:600}
.catgroup{display:flex;flex-direction:column}
.catgroup + .catgroup{margin-top:16px}
.prow{display:grid;grid-template-columns:minmax(140px,1fr) auto auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.qtyctl{display:flex;align-items:center;gap:4px}
.qtyctl input{width:78px;text-align:right}
.lowat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lowat input{width:64px}
@media (max-width:700px){
  .prow{grid-template-columns:1fr auto;row-gap:6px}
  .prow .pname{grid-column:1 / -1}
}

/* Recipes */
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.rcard:hover{border-color:var(--ink-2)}
.rcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rcard .t{font-weight:700}
.rcard .m{font-size:12.5px;color:var(--ink-2)}
.kcal{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.macro b{display:block;font-size:20px;font-family:"Bricolage Grotesque",Figtree,sans-serif}
.macro span{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.mbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-block:12px 14px}
.mbar i{display:block;height:100%}
.nutgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
@media (max-width:520px){.nutgrid{grid-template-columns:1fr}}
.nut{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.nut .dv{color:var(--ink-2);width:44px;text-align:right}
.ing{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ing:first-child{border-top:0}
.ing .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:2px}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.short{background:var(--warn-soft);color:var(--warn)} .ic.missing{background:var(--bad-soft);color:var(--bad)}
.ing .have{font-size:12.5px;color:var(--ink-2)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 84px auto;gap:6px;align-items:center}
.nutedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.nutedit input{width:100%}
.nutedit input[readonly]{background:var(--surface-2);color:var(--ink);border-color:transparent}
.edblock{display:flex;flex-direction:column;gap:3px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.edinfo{font-size:12.5px;color:var(--ink);padding-left:2px;min-height:18px}
.edinfo .src{color:var(--ink-2)}
.edinfo .miss{color:var(--warn);font-weight:600}
#lookupbar:empty{display:none}

/* Planner */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .range{font-weight:700;min-width:150px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.week{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.past{background:var(--surface-2)}
.day.drop{outline:2px dashed var(--accent);outline-offset:2px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dayhead b{font-size:14px}
.dayhead .dn{font-size:12px;color:var(--ink-2)}
.dtot{font-size:11.5px;color:var(--ink-2);font-weight:600}
.meal{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:2px;cursor:grab;font-size:13px}
.meal .slot{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meal .mn{font-weight:600;line-height:1.3}
.meal .mm{font-size:11.5px;color:var(--ink-2)}
.meal.eaten{opacity:.6}
.meal.eaten .mn{text-decoration:line-through}
.meal.skipped{opacity:.5}
.meal.open{cursor:default;border-color:var(--accent)}
.meal .medit{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.meal .medit input,.meal .medit select,.addbox select,.addbox input{width:100%}
.addbox{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:8px}
.addbtn{margin-top:auto;align-self:flex-start}
.prepgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.prepgrid{grid-template-columns:1fr}}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.formgrid .wide{grid-column:1 / -1}
.formgrid select,.formgrid input:not([type=checkbox]){width:100%}
.preview{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.listrow:first-child{border-top:0}

/* Fridge */
.fridge{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fitem{display:flex;flex-direction:column;gap:10px}
.fitem .count{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:44px;line-height:1;font-weight:700}
.fitem .count small{font-size:15px;font-family:Figtree,sans-serif;font-weight:600;color:var(--ink-2);margin-left:4px}
.portions{display:flex;gap:4px;flex-wrap:wrap}
.portions i{width:16px;height:16px;border-radius:4px;background:var(--accent)}
.portions i.sched{background:var(--butter)}

/* Notifications */
.ask{display:flex;flex-direction:column;gap:10px}
.ask .q{font-size:16px;font-weight:600}
.ask .when{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* Groceries */
.gline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.gline:first-child{border-top:0}
.gline .nm{font-weight:600}
.gline .det{font-size:12.5px;color:var(--ink-2)}
.shop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop.done .nm{text-decoration:line-through;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: no-preference){.btn,.rcard,.navbtn,.sday{transition:background .12s,border-color .12s,color .12s}}
/* Sign-in */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--bg)}
.authcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(23,33,28,.08)}
.authcard input{width:100%;font-size:15px;padding:9px 11px}
.btn.big{padding:11px 16px;font-size:15px;width:100%}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 13.5px Figtree,system-ui,sans-serif;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.autherr{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600}
.authmsg{color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600}
.acctbtns{display:flex;gap:6px;flex-wrap:wrap}
.acctmail{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#installbtn{width:100%}
.suggest{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);max-height:min(430px,60vh);overflow-y:auto;padding:6px}
.sg-h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px 4px}
.sg-item{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sg-item:hover,.sg-item.on{background:var(--accent-soft)}
.sg-name{font-weight:600;font-size:14px;line-height:1.3}
.sg-sub{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sg-tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.sg-note{font-size:13px;color:var(--ink-2);padding:10px}
.sg-foot{font-size:11px;color:var(--ink-2);padding:6px 10px 2px;border-top:1px solid var(--line);margin-top:4px}
.labelform{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.welcome{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
</style>
</head>

/* ---------- persistence (Supabase: one row per saved thing, private to its owner) ---------- */
const writes = {};
const SEP = '\u0001';
const sleep = ms => new Promise(r => setTimeout(r, ms));
function pendingCount(){ return Object.values(writes).filter(w => w.busy || w.has).length; }
function queue(col, id, data){
  if(!sb || !user) return;
  const path = col + SEP + id;
  const w = writes[path] || (writes[path] = {busy:false, has:false, next:null, last:null, tries:0});
  w.next = data; w.last = data; w.has = true;
  if(!w.busy) flush(path);
}
async function flush(path){
  const w = writes[path]; w.busy = true; renderSave();
  const [col, id] = path.split(SEP);
  while(w.has){
    const d = w.next; w.has = false;
    const {error} = d === null
      ? await sb.from('items').delete().eq('user_id', user.id).eq('collection', col).eq('id', id)
      : await sb.from('items').upsert({user_id:user.id, collection:col, id, data:d}, {onConflict:'user_id,collection,id'});
    if(error){
      w.tries++;
      if(w.tries <= 6){
        if(!w.has){ w.next = d; w.has = true; }
        renderSave(); await sleep(Math.min(15000, 800 * 2 ** w.tries)); continue;
      }
      toast("Couldn't save a change. Check your connection, then reload.");
    }
    w.tries = 0;
  }
  w.busy = false; renderSave();
}
function put(col, id, data){ S[col][id] = data; queue(col, id, data); }
function patch(col, id, part){ if(!S[col][id]) return; put(col, id, {...S[col][id], ...part}); }
function remove(col, id){ delete S[col][id]; queue(col, id, null); }

async function loadAll(){
  const next = Object.fromEntries(COLS.map(c => [c, {}]));
  const page = 1000;
  for(let from = 0; ; from += page){
    const {data, error} = await sb.from('items').select('collection,id,data').order('collection').order('id').range(from, from + page - 1);
    if(error) throw error;
    for(const r of data) if(next[r.collection]) next[r.collection][r.id] = r.data;
    if(data.length < page) break;
  }
  // Changes still being saved win over what the server had a moment ago.
  for(const [path, w] of Object.entries(writes)){
    if(!(w.busy || w.has)) continue;
    const [c, id] = path.split(SEP);
    if(!next[c]) continue;
    if(w.last === null) delete next[c][id]; else next[c][id] = w.last;
  }
  Object.assign(S, next);
  COLS.forEach(c => loaded.add(c));
  mode = 'live'; lastLoad = Date.now();
}
async function refresh(){
  try{ await loadAll(); }
  catch(e){ mode = 'off'; }
  render();
}

function authError(e){
  const m = String(e && e.message || '');
  if(/invalid login credentials/i.test(m)) return 'That email and password don’t match. Check them and try again.';
  if(/email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox for the link we sent.';
  if(/already registered|already been registered/i.test(m)) return 'There’s already an account with that email. Sign in instead.';
  if(/password should be at least/i.test(m)) return 'Use a password with at least 6 characters.';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if(/fetch|network/i.test(m)) return 'Can’t reach Prep Kitchen right now. Check your internet connection.';
  return m || 'Something went wrong. Try again.';
}
async function submitAuth(){
  const a = ui.auth;
  a.err = ''; a.msg = '';
  const email = a.email.trim(), password = a.password;
  if(a.mode !== 'reset' && !/^\S+@\S+\.\S+$/.test(email)){ a.err = 'Enter a valid email address.'; renderAuth(); return; }
  if(a.mode !== 'forgot' && password.length < 6){ a.err = 'Use a password with at least 6 characters.'; renderAuth(); return; }
  a.busy = true; renderAuth();
  try{
    if(a.mode === 'signin'){
      const {error} = await sb.auth.signInWithPassword({email, password}); if(error) throw error;
    } else if(a.mode === 'signup'){
      const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: PAGE_URL}}); if(error) throw error;
      if(!data.session){ a.mode = 'signin'; a.msg = 'Account created. Check your email for a confirmation link, then sign in here.'; }
    } else if(a.mode === 'forgot'){
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: PAGE_URL}); if(error) throw error;
      a.msg = 'If that email has an account, a reset link is on its way.';
    } else if(a.mode === 'reset'){
      const {error} = await sb.auth.updateUser({password}); if(error) throw error;
      a.mode = 'signin'; a.password = '';
      const {data} = await sb.auth.getSession();
      if(data.session){ a.busy = false; await onSignedIn(data.session); toast('Password updated.'); return; }
      a.msg = 'Password updated. Sign in with your new password.';
    }
  }catch(e){ a.err = authError(e); }
  a.busy = false;
  if(!user) renderAuth();
}

async function init(){
  if(CFG.supabaseUrl && CFG.supabaseKey && window.supabase){
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  }
  showApp(false); renderAuth();
  if(!sb) return;
  sb.auth.onAuthStateChange((event, session) => {
    // Defer so Supabase finishes its own work before we query.
    setTimeout(() => {
      if(event === 'PASSWORD_RECOVERY'){ ui.auth.mode = 'reset'; ui.auth.password = ''; showApp(false); renderAuth(); return; }
      if(ui.auth.mode === 'reset' && event !== 'SIGNED_OUT') return;
      if(session && session.user) onSignedIn(session);
      else onSignedOut();
    }, 0);
  });
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && user && !pendingCount() && Date.now() - lastLoad > 20000) refresh();
  });
  window.addEventListener('online', () => { if(user && !pendingCount()) refresh(); });
}

/* ---------- domain logic ---------- */
function pantryHave(name, unit){
  let have = 0, found = false, mismatch = false;
  for(const p of list('pantry')){
    if(!pantryMatches(p.name, name)) continue;
    const c = conv(num(p.qty), p.unit, unit);
    if(c === null){ mismatch = true; continue; }
    found = true; have += c;
  }
  return {have, found, mismatch};
}
function scaled(r, portions){
  const f = num(portions) / (num(r.servings) || 1);
  return (r.ingredients||[]).map(i => ({name:i.name, unit:i.unit, qty:num(i.qty)*f}));
}
function checkNeeds(needs){
  return needs.map(n => {
    const h = pantryHave(n.name, n.unit);
    const status = h.have >= n.qty - 1e-6 ? 'ok' : (h.have > 0 ? 'short' : 'missing');
    return {...n, have:h.have, mismatch:h.mismatch && !h.found, status, gap:Math.max(0, n.qty - h.have)};
  });
}
function mergeNeeds(needs){
  const out = [];
  for(const n of needs){
    const m = out.find(o => key(o.name) === key(n.name) && conv(1, n.unit, o.unit) !== null);
    if(m) m.qty += conv(n.qty, n.unit, m.unit); else out.push({...n});
  }
  return out;
}
function deduct(needs){
  for(const n of needs){
    let left = n.qty;
    for(const p of list('pantry')){
      if(left <= 1e-9) break;
      if(!pantryMatches(p.name, n.name)) continue;
      const avail = conv(num(p.qty), p.unit, n.unit);
      if(avail === null || avail <= 0) continue;
      const take = Math.min(avail, left);
      left -= take;

/* ----- ingredient nutrition ----- */
const r1 = v => Math.round(num(v)*10)/10;

function findFood(name, foodId){
  if(foodId){
    if(foodId.startsWith('builtin:')){ const b = builtinFoods().find(f => f.name === foodId.slice(8)); if(b) return b; }
    else if(S.foods[foodId]) return {...S.foods[foodId], id: foodId};
  }
  const p = phrase(name), pk = phrase(name, true);
  if(!p) return null;
  const pools = [savedFoods(), builtinFoods()];
  for(const pool of pools){ const f = pool.find(f => f.aliases.includes(p) || f.aliases.includes(pk)); if(f) return f; }
  let best = null, bestLen = 0;
  for(const pool of pools){
    for(const f of pool) for(const a of f.aliases){
      if(a && a.length > bestLen && (' '+pk+' ').includes(' '+a+' ')){ best = f; bestLen = a.length; }
    }
    if(best) return best;
  }
  return null;
}
function gramsOf(qty, unit, food){
  const u = UNITS[unit]; if(!u) return null;
  if(u[0] === 'mass') return conv(num(qty), unit, 'g');
  if(u[0] === 'vol') return conv(num(qty), unit, 'ml') * (num(food.gPerMl) || 1);
  return food.gPerPc ? num(qty) * num(food.gPerPc) : null;
}
function ingNutrition(ing){
  if(!String(ing.name||'').trim() || !(num(ing.qty) > 0)) return {status:'empty'};
  const food = findFood(ing.name, ing.foodId);
  if(!food) return {status:'unknown'};
  const g = gramsOf(ing.qty, ing.unit, food);
  if(g == null) return {status:'nopc', food};
  const vals = Object.fromEntries(NUTR.map(([k]) => [k, num(food.per100[k]) * g / 100]));
  return {status:'ok', food, grams:g, vals};
}
function recipeCalc(ingredients, servings){
  const lines = (ingredients||[]).map(ingNutrition);
  const total = Object.fromEntries(NUTR.map(([k]) => [k, 0]));
  for(const l of lines) if(l.status === 'ok') for(const k in total) total[k] += l.vals[k];
  const sv = Math.max(1, num(servings) || 1);
  const perServing = Object.fromEntries(Object.entries(total).map(([k,v]) => [k, v/sv]));

const SRC_LABEL = {'built-in':'typical values', usda:'USDA data', brand:'label data via USDA', claude:'saved values', label:'from your label', manual:'entered by you'};

  if(line.status === 'nopc') return `<span class="miss">Can't tell how much one piece weighs. Enter it in g or oz, or look it up.</span>`;
  const v = line.vals;
  return `<b>${fk(v.calories)} kcal</b> · ${r1(v.protein)} g protein · ${r1(v.carbs)} g carbs · ${r1(v.fat)} g fat <span class="src">· matched “${esc(line.food.name)}”, ${SRC_LABEL[line.food.source] || 'typical values'}, about ${fk(line.grams)} g</span>`;
}

// A pantry item counts for an ingredient when the names match, or the pantry name is a more
// specific version ending in the same words ("Bell & Evans chicken breast" covers "chicken breast").
function pantryMatches(pName, needName){
  if(key(pName) === key(needName)) return true;
  const a = phrase(pName), b = phrase(needName);
  return !!a && !!b && (a === b || (' ' + a).endsWith(' ' + b));
}
const FDC_KEY = CFG.fdcKey || 'DEMO_KEY';
const NID = {calories:[1008,2047,2048], protein:[1003], carbs:[1005], fat:[1004], fiber:[1079], sugar:[2000,1063], sodium:[1093], cholesterol:[1253], potassium:[1092], calcium:[1087], iron:[1089], vitA:[1106], vitC:[1162], vitD:[1114]};
const SMALL_WORDS = new Set(['and','or','of','with','in','the','a','an','for','to','on']);
function titleCase(s){

}
function sentenceCase(s){ s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }

function densityFrom(text, grams){
  const m = String(text || '').toLowerCase().match(/([\d.\/]+)\s*(cups?|tbsp|tablespoons?|tsp|teaspoons?|fl\.?\s?oz)/);

  let q = m[1].includes('/') ? m[1].split('/').reduce((a, b) => num(a) / num(b)) : num(m[1]);
  const ml = HOUSEHOLD_ML[m[2].replace('.', '').replace(/\s+/g, ' ')] || HOUSEHOLD_ML[m[2].replace(/[.\s]/g, '')];

function fdcToFood(f){
  const byId = {};

  const get = ids => { for(const id of ids) if(byId[id] != null) return byId[id]; return null; };
  if(get(NID.calories) == null) return null;
  const per100 = Object.fromEntries(NUTR.map(([k]) => [k, r1(get(NID[k]) ?? 0)]));
  if(byId[1106] == null && byId[1104] != null) per100.vitA = r1(byId[1104] * 0.3);
  if(byId[1114] == null && byId[1110] != null) per100.vitD = r1(byId[1110] / 40);
  const branded = f.dataType === 'Branded';
  let desc = String(f.description || '');
  let brand = '';
  if(branded){
    brand = titleCase(f.brandName || f.brandOwner || '');
    for(const b of [f.brandName, f.brandOwner]) if(b && desc.toUpperCase().startsWith(String(b).toUpperCase())){ desc = desc.slice(String(b).length).replace(/^[\s,:;-]+/, ''); break; }
  }
  // "Chicken Breast for Fajitas, Chicken Breast" -> drop a trailing part that repeats earlier words.
  const parts = desc.split(/,\s*/);
  if(parts.length > 1 && parts[0].toLowerCase().includes(parts[parts.length - 1].toLowerCase())) desc = parts.slice(0, -1).join(', ');
  const unit = String(f.servingSizeUnit || '').toLowerCase();
  const servingG = (unit === 'g' || unit === 'grm' || unit === 'ml' || unit === 'mlt') && num(f.servingSize) > 0 ? r1(f.servingSize) : null;

    id: 'fdc-' + f.fdcId, fdcId: f.fdcId, upc: f.gtinUpc || null,

const fdcCache = new Map();

async function fdcSearch(q, dataType, pageSize){

  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(FDC_KEY)}&query=${encodeURIComponent(q)}&dataType=${encodeURIComponent(dataType)}&pageSize=${pageSize}&requireAllWords=true`;
  const res = await fetch(url);
  if(res.status === 429 || res.status === 403){ fdcLimited = true; throw new Error('limited'); }
  if(!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  const foods = (j.foods || []).map(fdcToFood).filter(Boolean);

  const hit = name => { const w = phrase(name, true).split(' '); return words.every(q => w.some(x => x.startsWith(q))); };
  const mine = list('foods').filter(f => hit(f.name)).slice(0, 6).map(f => ({...f, id: f.id}));
  const common = builtinFoods().filter(f => hit(f.name) || f.aliases.some(a => hit(a))).slice(0, 6).map(f => ({...f, id: 'builtin:' + f.name, name: sentenceCase(f.name)}));

}

    return `${fk(p.calories*m)} kcal · ${r1(p.protein*m)} g protein per ${st}`;
  }

const SRC_TAG = {'built-in':'Common', usda:'USDA', brand:'Brand', label:'Your label', claude:'Saved', manual:'Saved'};

const DEFAULT_GOALS = {calories:2200, protein:150, carbs:230, fat:70};
function goals(){ return {...DEFAULT_GOALS, ...(S.settings.goals || {})}; }
function dayTotals(date){
  const z = () => ({calories:0, protein:0, carbs:0, fat:0});
  const t = {eaten:z(), planned:z()};
  for(const e of list('plan')){
    if(e.date !== date || e.status === 'skipped') continue;
    const n = nutr(S.recipes[e.recipeId]), b = e.status === 'eaten' ? t.eaten : t.planned;
    for(const k in b) b[k] += num(n[k]);
  }
  return t;
}

}

/* ----- Planner ----- */
function prepPreview(){
  const r = S.recipes[ui.prep.recipeId];

  const portions = num(ui.prep.portions);
  const checks = checkNeeds(scaled(r, portions));
  const miss = missingOf(checks);
  const n = nutr(r);
  const f = portions / (num(r.servings)||1);
  const endDate = addDays(ui.prep.start, Math.max(0, portions-1));
  return `<div class="preview">
    <div class="row"><b>${esc(r.name)}</b><span class="pill acc">×${fq(f)} of the recipe</span><span class="pill ${miss.length?'warn':'ok'}">${miss.length?`${miss.length} short`:'Pantry covers it'}</span></div>
    <p class="small muted">Recipe makes ${fq(r.servings)}; you want ${fq(portions)}. Each portion is ${fk(n.calories)} kcal and ${fq(n.protein)} g protein.</p>
    ${ingList(checks)}
    <p class="small"><b>What happens:</b> ${ui.prep.cooked ? `ingredients come out of your pantry now and ${fq(portions)} portions go in the fridge` : `the prep is saved for ${fmtD(ui.prep.cookDate)}; mark it cooked on that day to move it into the fridge`}${ui.prep.place && portions >= 1 ? `, and ${Math.floor(portions)} ${ui.prep.slot.toLowerCase()}s go on the calendar, ${fmtD(ui.prep.start)} – ${fmtD(endDate)}` : ''}.</p>
  </div>`;
}

function mealChip(e){

/* ----- Fridge ----- */
function viewFridge(){
  const t = today();
  const cooked = list('preps').filter(p => p.status === 'cooked' && num(p.remaining) > 0).sort((a,b) => String(a.cookedOn).localeCompare(b.cookedOn));
  const planned = list('preps').filter(p => p.status === 'planned').sort((a,b) => String(a.cookDate).localeCompare(b.cookDate));
  const total = cooked.reduce((s,p) => s + num(p.remaining), 0);
  return `
  <div class="pagehead">
    <div><h1>Fridge</h1><p class="sub">Prepped meals ready to eat. A portion comes off when you confirm you ate it in Notifications, or when you tap Ate one.</p></div>
    <div class="statrow"><div class="stat"><b>${fq(total)}</b><span>Portions ready</span></div><div class="stat"><b>${cooked.length}</b><span>Different meals</span></div></div>
  </div>
  ${cooked.length ? `<div class="fridge">${cooked.map(p => {
    const age = daysBetween(p.cookedOn || t, t);
    const sch = Math.min(scheduledFor(p.id), num(p.remaining));
    const n = nutr(S.recipes[p.recipeId]);
    return `<div class="card fitem">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><h2>${esc(prepName(p))}</h2>${age >= 4 ? `<span class="pill ${age>=5?'bad':'warn'}">Day ${age+1} in fridge</span>` : `<span class="pill">Day ${age+1} in fridge</span>`}</div>
      <div class="count">${fq(p.remaining)}<small>of ${fq(p.portions)} left</small></div>
      <div class="portions" aria-hidden="true">${Array.from({length:Math.ceil(num(p.remaining))}, (_,i) => `<i class="${i < sch ? 'sched' : ''}"></i>`).join('')}</div>
      <p class="small muted">${sch} on the calendar · ${Math.max(0, num(p.remaining) - sch)} unscheduled · prepped ${fmtD(p.cookedOn || t)} · ${fk(n.calories)} kcal each</p>
      <div class="row">
        <button class="btn sm" data-act="ateOne" data-id="${p.id}">Ate one</button>
        <button class="btn sm ghost" data-act="fridgeAdj" data-id="${p.id}" data-dir="1" aria-label="Add a portion">+1</button>
        <button class="btn sm ghost" data-act="fridgeAdj" data-id="${p.id}" data-dir="-1" aria-label="Remove a portion">−1</button>
        <span class="spacer"></span>${confirmBtn('preps:'+p.id, 'Throw out')}
      </div>
    </div>`; }).join('')}</div>` : `<div class="empty">The fridge is empty. Create a prep in the Planner and mark it cooked.</div>`}
  ${planned.length ? `<div class="card"><h2>Coming soon</h2>${planned.map(p => `<div class="listrow"><div><b>${esc(prepName(p))}</b> <span class="muted small">· ${fq(p.portions)} portions · cook ${fmtD(p.cookDate)}</span></div><button class="btn sm primary" data-act="prepCook" data-id="${p.id}">Mark cooked</button></div>`).join('')}</div>` : ''}
  <p class="small muted">Legend: <i class="sw" style="background:var(--butter)"></i> scheduled on the calendar &nbsp; <i class="sw" style="background:var(--accent)"></i> not scheduled yet</p>`;
}

/* ----- Notifications ----- */

  const t = today();

          <button class="btn" data-act="noteMove" data-id="${e.id}">Move</button>

/* ----- Groceries ----- */
function viewGroceries(){
  const t = today();
  const planned = list('preps').filter(p => p.status === 'planned');
  const needs = mergeNeeds(planned.flatMap(p => S.recipes[p.recipeId] ? scaled(S.recipes[p.recipeId], p.portions) : []));
  const short = checkNeeds(needs).filter(c => c.status !== 'ok');
  const low = list('pantry').filter(isLow).filter(p => !short.some(s => key(s.name) === key(p.name)));
  const plan = list('plan');
  const emptyDays = Array.from({length:7}, (_,i) => addDays(t,i)).filter(d => !plan.some(e => e.date === d && e.status !== 'skipped'));
  const unsched = activePreps().reduce((s,p) => s + Math.max(0, portionsLeft(p) - scheduledFor(p.id)), 0);
  const activeIds = new Set(activePreps().map(p => p.recipeId));
  const ideas = recipesSorted().map(r => ({r, miss: missingOf(recipeCheck(r))})).sort((a,b) => (activeIds.has(a.r.id) - activeIds.has(b.r.id)) || a.miss.length - b.miss.length);
  const shop = list('shopping').sort((a,b) => (a.checked - b.checked) || String(a.name).localeCompare(b.name));
  const checkedN = shop.filter(s => s.checked).length;
  const names = [...new Set([...list('pantry').map(p=>p.name), ...list('recipes').flatMap(r=>(r.ingredients||[]).map(i=>i.name))])].sort();
  const gl = (nm, det, q, u) => `<div class="gline"><div><div class="nm">${esc(nm)}</div><div class="det">${det}</div></div>
      <span class="small"><b>${niceQty(q,u)} ${esc(u)}</b></span>
      ${onList(nm) ? '<span class="pill ok">On list</span>' : `<button class="btn sm" data-act="listAdd" data-name="${esc(nm)}" data-qty="${niceQty(q,u)}" data-unit="${esc(u)}">Add</button>`}</div>`;
  return `
  <div class="pagehead"><div><h1>Groceries</h1><p class="sub">What to buy for the preps you've planned, ideas from your recipes, your list, and a place to log what you bought.</p></div></div>
  <div class="cols2">
    <div class="stack">
      <div class="card">
        <div class="cardhead"><h2>Buy for your planned preps</h2>${short.some(s=>!onList(s.name)) ? `<button class="btn sm primary" data-act="listAll">Add all</button>` : ''}</div>
        ${planned.length ? `<p class="small muted" style="margin-bottom:6px">For ${planned.map(p => `${esc(prepName(p))} (${fq(p.portions)}, ${fmtD(p.cookDate)})`).join(', ')}</p>` : ''}
        ${short.length ? short.map(s => gl(s.name, `Need ${niceQty(s.qty,s.unit)} ${esc(s.unit)} · have ${fq(s.have)}`, s.gap, s.unit)).join('')

      </div>
      <div class="card">
        <h2>Running low</h2>
        ${low.length ? low.map(p => gl(p.name, num(p.qty) <= 0 ? 'Out' : `Down to ${fq(p.qty)} ${esc(p.unit)}${p.lowAt!=null && p.lowAt!=='' ? ` (low at ${fq(p.lowAt)})` : ''}`, Math.max(num(p.lowAt)*2 - num(p.qty), STEP[p.unit] || 1), p.unit)).join('') : '<div class="empty">Nothing is running low.</div>'}
      </div>
      <div class="card">
        <h2>Fridge check</h2>
        <p class="small">${fq(unsched)} prepped portion${unsched===1?'':'s'} not on the calendar yet. ${emptyDays.length ? `${emptyDays.length} of the next 7 days have no meals planned (${emptyDays.slice(0,4).map(d=>fmtD(d,{weekday:'short'})).join(', ')}${emptyDays.length>4?'…':''}).` : 'Every day in the next week has at least one meal.'}</p>
      </div>
      <div class="card">
        <h2>Recipes you could prep</h2>
        <p class="small muted" style="margin-bottom:6px">Meals not already in your fridge come first, then those you're closest to having everything for.</p>
        ${ideas.length ? ideas.map(({r,miss}) => `<div class="gline" style="grid-template-columns:minmax(0,1fr) auto">
            <div><div class="nm">${esc(r.name)} ${activeIds.has(r.id) ? '<span class="pill">Already prepped</span>' : ''}</div>
            <div class="det">${miss.length ? 'Need ' + miss.map(m => `${esc(m.name)} (${niceQty(m.gap,m.unit)} ${esc(m.unit)})`).join(', ') : 'You have everything for a full batch'} · ${fk(nutr(r).calories)} kcal, ${fq(nutr(r).protein)} g protein</div></div>
            <div class="row">${miss.length ? `<button class="btn sm" data-act="listMissing" data-id="${r.id}" data-portions="${r.servings}">Add missing</button>` : ''}<button class="btn sm primary" data-act="prepThis" data-id="${r.id}">Plan prep</button></div>
          </div>`).join('') : '<div class="empty">Add recipes to get ideas here.</div>'}
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="cardhead"><h2>Shopping list</h2>${checkedN ? `<button class="btn sm primary" data-act="putAway">Put ${checkedN} checked in pantry</button>` : ''}</div>
        ${shop.length ? shop.map(s => `<div class="shop${s.checked?' done':''}">
            <input type="checkbox" id="sc-${s.id}" data-change="shopCheck" data-id="${s.id}" ${s.checked?'checked':''} aria-label="Bought ${esc(s.name)}">
            <label for="sc-${s.id}"><span class="nm" style="font-weight:600">${esc(s.name)}</span> <span class="muted small">${fq(s.qty)} ${esc(s.unit)}</span></label>
            ${confirmBtn('shopping:'+s.id)}
          </div>`).join('') : '<div class="empty">Your list is empty. Add suggestions from the left or type an item below.</div>'}
        <div class="row end" style="margin-top:12px">
          <label class="f" style="flex:1 1 150px">Item<input id="f-listNew-name" data-food="list" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" value="${esc(ui.listNew.name)}" data-bind="listNew.name" data-norender></label>
          <label class="f">Amount<input id="f-listNew-qty" class="w-num" type="number" step="any" min="0" value="${esc(ui.listNew.qty)}" data-bind="listNew.qty" data-norender></label>
          <label class="f">Unit<select id="f-listNew-unit" class="w-unit" data-bind="listNew.unit" data-norender>${opts(UNIT_LIST, ui.listNew.unit)}</select></label>
          <button class="btn" data-act="listNew">Add to list</button>
        </div>
        <p class="small muted" style="margin-top:10px">Tick items as you shop, then put them in the pantry in one go.</p>
      </div>
      <div class="card">
        <h2>Log a purchase</h2>
        <p class="small muted" style="margin-bottom:10px">Bought something that wasn't on the list? Add it straight to your pantry. If an item with the same name exists, the amount is added to it.</p>
        <datalist id="gnames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div class="row end">
          <label class="f" style="flex:1 1 150px">Item<input id="f-buy-name" data-food="buy" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" value="${esc(ui.buy.name)}" data-bind="buy.name" data-norender placeholder="e.g. Chicken breast"></label>
          <label class="f">Amount<input id="f-buy-qty" class="w-num" type="number" step="any" min="0" value="${esc(ui.buy.qty)}" data-bind="buy.qty" data-norender></label>
          <label class="f">Unit<select id="f-buy-unit" class="w-unit" data-bind="buy.unit" data-norender>${opts(UNIT_LIST, ui.buy.unit)}</select></label>
          <label class="f">Category<select id="f-buy-category" data-bind="buy.category" data-norender>${opts(CATS, ui.buy.category)}</select></label>
          <button class="btn primary" data-act="buyLog">Add to pantry</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }
let confirmT;
function eatPortion(prepId){ const p = S.preps[prepId]; if(p && p.status === 'cooked') patch('preps', prepId, {remaining: Math.max(0, num(p.remaining) - 1)}); }
function deletePrep(id){ list('plan').filter(e => e.prepId === id && e.status === 'planned').forEach(e => remove('plan', e.id)); remove('preps', id); }
function cookPrep(id){
  const p = S.preps[id]; const r = S.recipes[p.recipeId];
  if(r) deduct(scaled(r, p.portions));
  patch('preps', id, {status:'cooked', cookedOn: today(), remaining: num(p.portions)});
  toast(`${prepName(p)} is in the fridge. Pantry updated.`);
}

const ACT = {
  tab: el => { ui.tab = el.dataset.id; lsSet('pk-tab', ui.tab); ui.confirm = null; window.scrollTo(0,0); },

    ui.labelFor = null;

  recipeSave: () => {

    put('recipes', id, {name:d.name.trim(), servings, time:d.time.trim(), ingredients,
      steps: d.steps.split('\n').map(s => s.trim()).filter(Boolean),
      autoNutrition: !!d.auto,
      nutrition: Object.fromEntries(NUTR.map(([k]) => [k, calc ? (k === 'calories' ? Math.round(calc.perServing[k]) : r1(calc.perServing[k])) : num(d.nutrition[k])]))});
    ui.rEdit = null; ui.rSel = id; ui.rScale = ''; toast('Recipe saved.');

  prepThis: el => { const r = S.recipes[el.dataset.id]; ui.prep.recipeId = el.dataset.id; ui.prep.portions = String(r.servings); ui.tab = 'planner'; lsSet('pk-tab','planner'); window.scrollTo(0,0); },
  listMissing: el => {
    const r = S.recipes[el.dataset.id];
    const miss = missingOf(recipeCheck(r, num(el.dataset.portions)));
    miss.forEach(m => { if(!onList(m.name)) addToList(m.name, m.unit === 'pc' ? Math.ceil(m.gap - 1e-6) : m.gap, m.unit); });

  },
  prepCreate: () => {
    const f = ui.prep, r = S.recipes[f.recipeId];

    if(f.cooked){ deduct(scaled(r, portions)); doc.status = 'cooked'; doc.cookedOn = f.cookDate && f.cookDate <= today() ? f.cookDate : today(); doc.remaining = portions; }
    put('preps', id, doc);
    if(f.place){ for(let i=0; i<Math.floor(portions); i++) put('plan', uid('m'), {date:addDays(f.start, i), slot:f.slot, prepId:id, recipeId:f.recipeId, name:r.name, status:'planned'}); ui.week = weekStart(f.start); }
    toast(f.cooked ? `${fq(portions)} portions of ${r.name} added to the fridge.` : `Prep saved for ${fmtD(doc.cookDate)}.`);

  prepCook: el => cookPrep(el.dataset.id),
  week: el => { const d = +el.dataset.dir; ui.week = d === 0 ? weekStart(today()) : addDays(ui.week, d); },
  addOpen: el => { ui.addTo = el.dataset.cell; const a = activePreps(); if(!S.preps[ui.add.prepId]) ui.add.prepId = a[0] ? a[0].id : ''; },
  addCancel: () => { ui.addTo = null; },

  fridgeAdj: el => { const p = S.preps[el.dataset.id]; patch('preps', el.dataset.id, {remaining: Math.max(0, num(p.remaining) + num(el.dataset.dir))}); },
  noteYes: el => { const e = S.plan[el.dataset.id]; patch('plan', e && el.dataset.id, {status:'eaten', answeredAt:new Date().toISOString()}); eatPortion(e.prepId); toast('Logged. One portion off the fridge.'); },
  noteNo: el => { ui.noteNo = el.dataset.id; ui.moveDate = addDays(today(), 1); },
  noteBack: () => { ui.noteNo = null; },
  noteSkip: el => { patch('plan', el.dataset.id, {status:'skipped', answeredAt:new Date().toISOString()}); ui.noteNo = null; },
  noteMove: el => { if(!ui.moveDate) return; patch('plan', el.dataset.id, {date: ui.moveDate}); ui.noteNo = null; toast(`Moved to ${fmtD(ui.moveDate)}.`); },
  noteUndo: el => {
    const e = S.plan[el.dataset.id];
    if(e.status === 'eaten'){ const p = S.preps[e.prepId]; if(p && p.status === 'cooked') patch('preps', e.prepId, {remaining: num(p.remaining) + 1}); }
    const {answeredAt, ...rest} = e; put('plan', el.dataset.id, {...rest, status:'planned'});
  },
  listAdd: el => { addToList(el.dataset.name, num(el.dataset.qty), el.dataset.unit); },
  listAll: () => {
    const planned = list('preps').filter(p => p.status === 'planned');
    const short = checkNeeds(mergeNeeds(planned.flatMap(p => S.recipes[p.recipeId] ? scaled(S.recipes[p.recipeId], p.portions) : []))).filter(c => c.status !== 'ok');
    short.forEach(s => { if(!onList(s.name)) addToList(s.name, s.unit === 'pc' ? Math.ceil(s.gap - 1e-6) : Math.round(s.gap*100)/100, s.unit); });
  },
  listNew: () => { const f = ui.listNew; if(!f.name.trim()){ toast('Type an item name.'); return; } addToList(f.name, num(f.qty) || 1, f.unit); ui.listNew = {name:'', qty:'', unit:f.unit}; },
  putAway: () => {

    ui.buy = {name:'', qty:'', unit:f.unit, category:f.category};
  }

const CHANGE = {
  pqty: el => patch('pantry', el.dataset.id, {qty: Math.max(0, num(el.value))}),
  punit: el => { const p = S.pantry[el.dataset.id]; const c = conv(num(p.qty), p.unit, el.value); const lc = p.lowAt != null && p.lowAt !== '' ? conv(num(p.lowAt), p.unit, el.value) : null;
    patch('pantry', el.dataset.id, {unit: el.value, qty: c === null ? num(p.qty) : Math.round(c*1000)/1000, lowAt: p.lowAt == null || p.lowAt === '' ? null : (lc === null ? num(p.lowAt) : Math.round(lc*1000)/1000)}); },
  plow: el => patch('pantry', el.dataset.id, {lowAt: el.value === '' ? null : num(el.value)}),
  shopCheck: el => patch('shopping', el.dataset.id, {checked: el.checked}),
  importFile: async el => {
    const file = el.files && el.files[0]; el.value = '';
    if(!file) return;
    try{
      const json = JSON.parse(await file.text());
      const data = json && json.data;
      if(!data || typeof data !== 'object') throw new Error('bad');
      const rows = [];
      for(const c of COLS) for(const [id, d] of Object.entries(data[c] || {})) if(d && typeof d === 'object') rows.push({collection:c, id:String(id), data:d});
      if(!rows.length){ ui.acct.msg = 'That backup file is empty.'; render(); return; }
      ui.acct.msg = `Restoring ${rows.length} items…`; render();
      await bulkSave(rows);
      rows.forEach(r => { S[r.collection][r.id] = r.data; });
      ui.acct.msg = `Restored ${rows.length} items from ${file.name}.`;
    }catch(e){
      ui.acct.msg = e && e.message === 'bad' || e instanceof SyntaxError ? "That file isn't a Prep Kitchen backup." : "Couldn't finish restoring. Check your connection and try again.";
    }
    render();
  }
};
document.addEventListener('submit', ev => {
  if(ev.target.id === 'authform'){ ev.preventDefault(); submitAuth(); }
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.dataset.act !== 'del') ui.confirm = null;
  fn(el, ev); render();
});
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-bind]'); if(!el) return;
  setPath(ui, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
  if(el.dataset.bind === 'prep.cookDate' && !ui.prep.startTouched) ui.prep.start = el.value;
  if(el.dataset.bind === 'prep.start') ui.prep.startTouched = true;
  if(el.dataset.bind === 'prep.recipeId' && S.recipes[el.value]) ui.prep.portions = String(S.recipes[el.value].servings);
  if(!('norender' in el.dataset)) render();
  else if(el.dataset.bind.startsWith('rEdit.') && !el.dataset.bind.startsWith('rEdit.nutrition.')) refreshEditorCalc();
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]'); if(!el) return;
  CHANGE[el.dataset.change](el); render();
});
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter') return;
  const el = ev.target;
  if(el.matches('[data-change]')){ el.blur(); return; }
  const map = {'pNew':'pantryAdd','buy':'buyLog','listNew':'listNew'};
  const b = el.dataset && el.dataset.bind && map[el.dataset.bind.split('.')[0]];
  if(b){ ev.preventDefault(); ACT[b](); render(); }
});
/* drag & drop meals between days */
document.addEventListener('dragstart', ev => { const el = ev.target.closest && ev.target.closest('[data-drag]'); if(el){ ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('[data-drop]'); if(d){ ev.preventDefault(); document.querySelectorAll('.day.drop').forEach(x => x !== d && x.classList.remove('drop')); d.classList.add('drop'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('[data-drop]'); if(d && !d.contains(ev.relatedTarget)) d.classList.remove('drop'); });
document.addEventListener('drop', ev => {
  const d = ev.target.closest && ev.target.closest('[data-drop]'); if(!d) return;
  ev.preventDefault(); const id = ev.dataTransfer.getData('text/plain');
  const [date, slot] = d.dataset.drop.split('|');
  if(S.plan[id] && (S.plan[id].date !== date || S.plan[id].slot !== slot)){ patch('plan', id, {date, slot}); toast(`Moved to ${slot.toLowerCase()} on ${fmtD(date)}.`); }
  render();
});

init();
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {}); });
}
</script>
</body>
</html>
