<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
// Color palettes and themes. Each has a light and a dark set of the page's color tokens;
// themes also add a faint background pattern. Built here so they apply before the page paints.
window.PK_PALETTES = (() => {
  const P = {
    basil:  {name:'Basil', group:'palette',
      light:{bg:'#F2F4F0',surface:'#FFFFFF',surface2:'#E8ECE5',ink:'#17211C',ink2:'#56625B',line:'#D5DCD2',accent:'#2D6A4A',accentInk:'#FFFFFF',accentSoft:'#DBEBE0',butter:'#F3D05B',side:'#E6EBE3',today:'#F2F8F3'},
      dark:{bg:'#101512',surface:'#18201B',surface2:'#222B25',ink:'#E6ECE7',ink2:'#9BA79F',line:'#2E3931',accent:'#6CC394',accentInk:'#0D1912',accentSoft:'#1E3829',butter:'#E8C24E',side:'#0B0F0D',today:'#1A2720'}},
    slate:  {name:'Slate', group:'palette',
      light:{bg:'#F2F4F7',surface:'#FFFFFF',surface2:'#E6EAF0',ink:'#1A2130',ink2:'#5A6475',line:'#D6DCE5',accent:'#3E5C86',accentInk:'#FFFFFF',accentSoft:'#DEE6F2',butter:'#E9B949',side:'#E5E9F0',today:'#F1F5FB'},
      dark:{bg:'#0F131A',surface:'#171C25',surface2:'#212835',ink:'#E5E9F0',ink2:'#98A2B3',line:'#2C3442',accent:'#8FB0E0',accentInk:'#0E1520',accentSoft:'#22314A',butter:'#E3B84E',side:'#0B0E14',today:'#1A2433'}},
    ocean:  {name:'Ocean', group:'palette',
      light:{bg:'#EFF6F8',surface:'#FFFFFF',surface2:'#E0EEF2',ink:'#102A33',ink2:'#4E6A73',line:'#CCE0E6',accent:'#0E7490',accentInk:'#FFFFFF',accentSoft:'#D5EEF4',butter:'#F4C95D',side:'#E1EEF2',today:'#EAF6F9'},
      dark:{bg:'#0A1519',surface:'#0F2026',surface2:'#16303A',ink:'#E1F0F4',ink2:'#8FB0BA',line:'#1F3B45',accent:'#4CC3DE',accentInk:'#06181E',accentSoft:'#123844',butter:'#EAC25A',side:'#071014',today:'#102A33'}},
    plum:   {name:'Plum', group:'palette',
      light:{bg:'#F6F2F7',surface:'#FFFFFF',surface2:'#ECE3EF',ink:'#25182B',ink2:'#67566E',line:'#E0D3E5',accent:'#7B3F8C',accentInk:'#FFFFFF',accentSoft:'#EEDDF3',butter:'#EDBF4E',side:'#EDE4F0',today:'#F7EEFA'},
      dark:{bg:'#140E17',surface:'#1D1521',surface2:'#291E2F',ink:'#EFE6F2',ink2:'#AB98B3',line:'#36283D',accent:'#CE9BDD',accentInk:'#1E0F24',accentSoft:'#3A2544',butter:'#E6BE58',side:'#0E0A10',today:'#251A2B'}},
    sunset: {name:'Sunset', group:'palette',
      light:{bg:'#FBF3EE',surface:'#FFFFFF',surface2:'#F5E6DC',ink:'#2B1A12',ink2:'#735A4C',line:'#EDD8CA',accent:'#C2561C',accentInk:'#FFFFFF',accentSoft:'#F8E0D0',butter:'#F2C14E',side:'#F4E6DC',today:'#FDF1E9'},
      dark:{bg:'#17100C',surface:'#211712',surface2:'#2E2019',ink:'#F5E8DF',ink2:'#B89E8F',line:'#3A2A21',accent:'#F09A62',accentInk:'#241208',accentSoft:'#43291B',butter:'#EDC05A',side:'#0F0A07',today:'#2A1D15'}},
    love:   {name:'Love', group:'theme', note:'Floating hearts, tumbling petals and a beating heart',
      light:{bg:'#FCF1F3',surface:'#FFFFFF',surface2:'#F7E1E6',ink:'#2E1419',ink2:'#7A525B',line:'#F0D2D9',accent:'#C8304F',accentInk:'#FFFFFF',accentSoft:'#FADCE3',butter:'#F7A8BA',side:'#F8E3E8',today:'#FFF0F3'},
      dark:{bg:'#1A0D11',surface:'#241318',surface2:'#321A21',ink:'#F8E6EA',ink2:'#C096A0',line:'#43242C',accent:'#FF7E98',accentInk:'#2A0A12',accentSoft:'#4A1D29',butter:'#FFB3C4',side:'#12080B',today:'#2C151C'}},
    space:  {name:'Space', group:'theme', note:'Starfield, nebulas, a ringed planet and shooting stars',
      light:{bg:'#EEEDF8',surface:'#FFFFFF',surface2:'#E2E0F2',ink:'#16142B',ink2:'#5B5878',line:'#D4D1EA',accent:'#5B4BD6',accentInk:'#FFFFFF',accentSoft:'#E1DDFB',butter:'#F5C84C',side:'#E3E1F4',today:'#F1EFFD'},
      dark:{bg:'#07061A',surface:'#100E27',surface2:'#1A1836',ink:'#E8E6FA',ink2:'#9A96C2',line:'#26234A',accent:'#9C8CFF',accentInk:'#0D0A2B',accentSoft:'#2A2360',butter:'#FFD86B',side:'#04030F',today:'#17143A'}},
    forest: {name:'Forest', group:'theme', note:'Drifting pine ridges, mist, leaves and fireflies',
      light:{bg:'#EFF2EA',surface:'#FDFDF9',surface2:'#E2E8D8',ink:'#1B2415',ink2:'#58654C',line:'#D2DBC5',accent:'#3F6B2A',accentInk:'#FFFFFF',accentSoft:'#DDEACF',butter:'#C9893B',side:'#E0E7D5',today:'#F1F6EA'},
      dark:{bg:'#0C120A',surface:'#141C11',surface2:'#1E2819',ink:'#E4EBDB',ink2:'#9AA88C',line:'#2A3623',accent:'#8CC46A',accentInk:'#0C1608',accentSoft:'#253A1B',butter:'#D9A15A',side:'#080C06',today:'#182412'}}
  };
  P.deepsea = {name:'Deep Sea', group:'theme', note:'Light rays, swaying kelp, fish, bubbles and jellyfish',
    light:{bg:'#E8F5F8',surface:'#FFFFFF',surface2:'#DCEEF3',ink:'#0E2A33',ink2:'#4A6B75',line:'#C7E1E8',accent:'#0B7A8F',accentInk:'#FFFFFF',accentSoft:'#D3EEF3',butter:'#F6C85F',side:'#DDEFF4',today:'#EAF7FA'},
    dark:{bg:'#041620',surface:'#0A2230',surface2:'#10303F',ink:'#DDF1F7',ink2:'#86AEBB',line:'#1B3E4D',accent:'#3FD0E0',accentInk:'#03161C',accentSoft:'#0E3A47',butter:'#F5CB63',side:'#031018',today:'#0C2B38'}};
  const vars = t => `--bg:${t.bg};--surface:${t.surface};--surface-2:${t.surface2};--ink:${t.ink};--ink-2:${t.ink2};--line:${t.line};--accent:${t.accent};--accent-ink:${t.accentInk};--accent-soft:${t.accentSoft};--butter:${t.butter};--side:${t.side};--today:${t.today};--bg-art:${t.art || 'none'};--bg-art-size:${t.artSize || 'auto'};`;
  let css = '';
  for(const [id, p] of Object.entries(P)){
    const r = `:root[data-palette="${id}"]`;
    css += `${r}{${vars(p.light)}}@media (prefers-color-scheme: dark){${r}:not([data-theme="light"]){${vars(p.dark)}}}${r}[data-theme="dark"]{${vars(p.dark)}}`;
  }
  const st = document.createElement('style'); st.id = 'palette-css'; st.textContent = css;
  document.head.appendChild(st);
  return P;
})();
// Apply the saved theme, palette and text size before the page paints.
try{ const a = JSON.parse(localStorage.getItem('pk-appearance') || '{}'); if(a.theme === 'light' || a.theme === 'dark') document.documentElement.dataset.theme = a.theme; if(a.textSize) document.documentElement.dataset.text = a.textSize; if(a.palette && window.PK_PALETTES[a.palette]) document.documentElement.dataset.palette = a.palette; }catch(e){}
</script>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#17211C; --ink-2:#56625B; --line:#D5DCD2;
  --accent:#2D6A4A; --accent-ink:#FFFFFF; --accent-soft:#DBEBE0; --butter:#F3D05B;
  --ok:#2A7A4C; --ok-soft:#DCF0E2; --warn:#9A6200; --warn-soft:#FAEDCB; --bad:#B3261E; --bad-soft:#F8DEDB;
  --protein:#3A7CA5; --carbs:#D39A1E; --fat:#C4553D;
  --shadow:0 1px 2px rgba(23,33,28,.06);
  --side:#E6EBE3; --today:#F2F8F3;
  --bg-art:none; --bg-art-size:auto;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE7; --ink-2:#9BA79F; --line:#2E3931;
    --accent:#6CC394; --accent-ink:#0D1912; --accent-soft:#1E3829; --butter:#E8C24E;
    --ok:#6CC394; --ok-soft:#1C3325; --warn:#E6B350; --warn-soft:#382C12; --bad:#F2877C; --bad-soft:#3C1C1A;
    --protein:#72B2DA; --carbs:#EDC25A; --fat:#E98B74; --shadow:none;
    --side:#0B0F0D; --today:#1A2720;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#18201B; --surface-2:#222B25; --ink:#E6ECE7; --ink-2:#9BA79F; --line:#2E3931;
  --accent:#6CC394; --accent-ink:#0D1912; --accent-soft:#1E3829; --butter:#E8C24E;
  --ok:#6CC394; --ok-soft:#1C3325; --warn:#E6B350; --warn-soft:#382C12; --bad:#F2877C; --bad-soft:#3C1C1A;
  --protein:#72B2DA; --carbs:#EDC25A; --fat:#E98B74; --shadow:none;
  --side:#0B0F0D; --today:#1A2720;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--bg-art);background-size:var(--bg-art-size);background-attachment:fixed;color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:0;padding-block:0;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px;overflow-y:auto}
.side .brand{padding-inline:8px}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;border:0;background:none;color:var(--ink-2);font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
.navbtn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.navbtn.on svg{color:var(--accent)}
.navbtn .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.navbtn .cnt.warn{color:var(--warn)}
.navbtn .badge{margin-left:auto}
.navsep{height:1px;background:var(--line);margin:6px 10px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-inline:8px;font-size:12.5px;color:var(--ink-2)}
.sidefoot .date{font-weight:700;color:var(--ink);font-size:13px}
.content{padding-inline:32px;padding-block:28px 64px;min-width:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;z-index:10;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .side .brand{padding-inline:0;font-size:18px}
  .side .nav,.navsep,.sidefoot{display:none}
  .content{padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--side) 88%, transparent);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink-2);font:600 10.5px Figtree,system-ui,sans-serif;padding:5px 2px;position:relative;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
  .tabbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbtn.on{color:var(--accent)}
  .tabbtn.on svg{stroke-width:2.2}
  .tabbtn .badge{position:absolute;top:1px;left:calc(50% + 5px)}
  .sheet-back:not([hidden]){display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
  .sheet:not([hidden]){display:block;position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
  .sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sheet-item{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font:600 15px Figtree,system-ui,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
  .sheet-item.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .sheet-item svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sheet-item .cnt,.sheet-item .badge{margin-left:auto}
  #updatebar{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
/* Today */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.dash .span2{grid-column:span 2}
.dash .span3{grid-column:1 / -1}
@media (max-width:1100px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.dash .span2{grid-column:1 / -1}}
@media (max-width:700px){.dash{grid-template-columns:1fr}}
.gtrack{display:flex;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-block:4px 2px}
.gtrack i{display:block;height:100%}
.todaynums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:620px){.todaynums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tnum{display:flex;flex-direction:column;gap:2px}
.tnum .lbl{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em}
.tnum b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:30px;line-height:1.1}
.tnum b small{font-family:Figtree,sans-serif;font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.tmeal{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tmeal:first-child{border-top:0}
.tmeal .slot{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:700px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sday{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.sday:hover{border-color:var(--ink-2)}
.sday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sday b{font-size:13px}
.sday span{font-size:11.5px;color:var(--ink-2)}
.sday .dots{display:flex;gap:3px;margin-top:4px;min-height:7px}
.sday .dots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sday .dots i.done{background:var(--ink-2);opacity:.5}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-child{border-top:0}
/* Planner grid */
.calwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:104px repeat(7,minmax(128px,1fr));min-width:1000px;background:var(--line);gap:1px}
.cal > div{background:var(--surface);padding:8px;min-width:0}
.cal .ch{background:var(--surface-2);display:flex;flex-direction:column;gap:1px}
.cal .ch b{font-size:13.5px}
.cal .ch span{font-size:11.5px;color:var(--ink-2)}
.cal .ch.today{background:var(--accent);color:var(--accent-ink)}
.cal .ch.today span{color:var(--accent-ink);opacity:.85}
.cal .rh{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:flex-start}
.cal .cell{display:flex;flex-direction:column;gap:6px;min-height:92px}
.cal .cell.today{background:var(--today)}
.cal .cell.past{background:var(--bg)}
.cal .cell.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.cal .tot{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2)}
.cal .tot b{color:var(--ink);font-size:13px;display:block}
.celladd{margin-top:auto;align-self:flex-start;opacity:.55}
.cell:hover .celladd,.celladd:focus-visible{opacity:1}
.rsearch{width:100%}
.cal .meal .slot{display:none}
.cal .meal{background:var(--surface);border-color:var(--line)}
.cal .cell.today .meal,.cal .cell.past .meal{background:var(--surface)}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:28px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;letter-spacing:-.01em}
h3{font-size:15px}
p{margin:0}
.sub{color:var(--ink-2);margin-top:4px;max-width:64ch}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--butter);border:2px solid var(--side)}
.savestate{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--warn)} .dot.off{background:var(--bad)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;line-height:1;padding:3px 6px;font-weight:700}
main{display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card > h2{margin-bottom:10px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{align-items:flex-end}
.spacer{flex:1}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.cols2{grid-template-columns:1fr}}
button{font:inherit}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px Figtree,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

const writes = {};

function queue(col, id, data){

  w.next = data; w.last = data; w.has = true;
  if(!w.busy) flush(path);
}
async function flush(path){
  const w = writes[path]; w.busy = true; renderSave();
  const [col, id] = path.split(SEP);
  while(w.has){
    const d = w.next; w.has = false;
    const {error} = d === null
      ? await sb.from('items').delete().eq('user_id', user.id).eq('collection', col).eq('id', id)
      : await sb.from('items').upsert({user_id:user.id, collection:col, id, data:d}, {onConflict:'user_id,collection,id'});
    if(error){
      w.tries++;
      if(w.tries <= 6){
        if(!w.has){ w.next = d; w.has = true; }
        renderSave(); await sleep(Math.min(15000, 800 * 2 ** w.tries)); continue;
      }
      toast("Couldn't save a change. Check your connection, then reload.");
    }
    w.tries = 0;

}

function remove(col, id){ delete S[col][id]; queue(col, id, null); }

async function loadAll(){
  const next = Object.fromEntries(COLS.map(c => [c, {}]));
  const page = 1000;
  for(let from = 0; ; from += page){
    const {data, error} = await sb.from('items').select('collection,id,data').order('collection').order('id').range(from, from + page - 1);
    if(error) throw error;
    for(const r of data) if(next[r.collection]) next[r.collection][r.id] = r.data;
    if(data.length < page) break;
  }
  // Changes still being saved win over what the server had a moment ago.
  for(const [path, w] of Object.entries(writes)){
    if(!(w.busy || w.has)) continue;
    const [c, id] = path.split(SEP);
    if(!next[c]) continue;
    if(w.last === null) delete next[c][id]; else next[c][id] = w.last;
  }
  Object.assign(S, next);
  COLS.forEach(c => loaded.add(c));
  mode = 'live'; lastLoad = Date.now();
}

async function submitAuth(){
  const a = ui.auth;

  if(a.mode !== 'forgot' && password.length < 6){ a.err = 'Use a password with at least 6 characters.'; renderAuth(); return; }
  a.busy = true; renderAuth();
  try{
    if(a.mode === 'signin'){

    } else if(a.mode === 'signup'){
      const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: PAGE_URL}}); if(error) throw error;
      if(!data.session){ a.mode = 'signin'; a.msg = 'Account created. Check your email for a confirmation link, then sign in here.'; }
    } else if(a.mode === 'forgot'){
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: PAGE_URL}); if(error) throw error;

/* ---------- domain logic ---------- */
function pantryHave(name, unit){
  let have = 0, found = false, mismatch = false;
  for(const p of list('pantry')){
    if(!pantryMatches(p.name, name)) continue;
    const c = conv(num(p.qty), p.unit, unit);
    if(c === null){ mismatch = true; continue; }
    found = true; have += c;
  }
  return {have, found, mismatch};
}
function scaled(r, portions){
  const f = num(portions) / (num(r.servings) || 1);
  return (r.ingredients||[]).map(i => {
    const qty = num(i.qty) * f;
    // Servings become grams for pantry, cooking and grocery math; srv keeps the serving view for display.
    if(i.unit === 'serving'){
      const sv = servingOf(findFood(i.name, i.foodId));
      if(sv) return {name:i.name, unit:'g', qty: qty * sv.g, srv:{qty, text: sv.text}};
    }
    return {name:i.name, unit:i.unit, qty};
  });
}
function checkNeeds(needs){
  return needs.map(n => {
    const h = pantryHave(n.name, n.unit);
    const status = h.have >= n.qty - 1e-6 ? 'ok' : (h.have > 0 ? 'short' : 'missing');
    return {...n, have:h.have, mismatch:h.mismatch && !h.found, status, gap:Math.max(0, n.qty - h.have)};
  });
}
function mergeNeeds(needs){
  const out = [];
  for(const n of needs){
    const m = out.find(o => key(o.name) === key(n.name) && conv(1, n.unit, o.unit) !== null);
    if(m) m.qty += conv(n.qty, n.unit, m.unit); else out.push({...n});
  }
  return out;
}
function deduct(needs){
  for(const n of needs){
    let left = n.qty;
    for(const p of list('pantry')){
      if(left <= 1e-9) break;
      if(!pantryMatches(p.name, n.name)) continue;
      const avail = conv(num(p.qty), p.unit, n.unit);
      if(avail === null || avail <= 0) continue;
      const take = Math.min(avail, left);
      left -= take;
      patch('pantry', p.id, {qty: Math.max(0, Math.round((num(p.qty) - conv(take, n.unit, p.unit))*1000)/1000)});
    }
  }
}
function addToPantry(name, qty, unit, category){
  name = String(name).trim(); qty = num(qty);
  const m = list('pantry').find(p => key(p.name) === key(name) && conv(1, unit, p.unit) !== null);
  if(m){ patch('pantry', m.id, {qty: Math.round((num(m.qty) + conv(qty, unit, m.unit))*1000)/1000}); return m.name; }
  const guess = category || guessCategory(name);
  put('pantry', uid('p'), {name, qty, unit, category:guess, lowAt:null});
  return name;
}
function guessCategory(name){
  const p = list('pantry').find(x => key(x.name) === key(name));
  return p ? p.category : 'Other';
}
function isLow(p){ return num(p.qty) <= 0 || (p.lowAt != null && p.lowAt !== '' && num(p.qty) <= num(p.lowAt)); }
function recipeCheck(r, portions){ return checkNeeds(scaled(r, portions ?? r.servings)); }
function missingOf(checks){ return checks.filter(c => c.status !== 'ok'); }
function nutr(r){
  if(!r) return {};
  if(r.autoNutrition) return recipeCalc(r.ingredients, r.servings).perServing;
  return r.nutrition || {};
}
function prepName(p){ return (S.recipes[p.recipeId] && S.recipes[p.recipeId].name) || p.recipeName || 'Meal'; }
function scheduledFor(prepId){ return list('plan').filter(e => e.prepId === prepId && e.status === 'planned').length; }
function portionsLeft(p){ return p.status === 'cooked' ? num(p.remaining) : num(p.portions); }
function activePreps(){ return list('preps').filter(p => p.status === 'planned' || (p.status === 'cooked' && num(p.remaining) > 0)); }
function pendingAlerts(){
  const t = today();
  return list('plan').filter(e => e.status === 'planned' && e.date <= t)
    .sort((a,b) => a.date.localeCompare(b.date) || SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot));
}
function recipesSorted(){ return list('recipes').sort((a,b) => String(a.name).localeCompare(b.name)); }
function addToList(name, qty, unit){
  const m = list('shopping').find(s => !s.checked && key(s.name) === key(name) && conv(1, unit, s.unit) !== null);
  if(m){ patch('shopping', m.id, {qty: Math.round((num(m.qty) + conv(num(qty), unit, m.unit))*100)/100}); }
  else put('shopping', uid('s'), {name:String(name).trim(), qty:Math.round(num(qty)*100)/100, unit, checked:false, addedOn:today()});
}
function onList(name){ return list('shopping').some(s => !s.checked && key(s.name) === key(name)); }
function niceQty(q, unit){

}

/* ----- ingredient nutrition ----- */
const r1 = v => Math.round(num(v)*10)/10;
function savedFoods(){ return list('foods').map(f => ({...f, aliases: [...(f.aliases||[]), phrase(f.name)]})); }
function findFood(name, foodId){
  if(foodId){
    if(foodId.startsWith('builtin:')){ const b = builtinFoods().find(f => f.name === foodId.slice(8)); if(b) return b; }
    else if(S.foods[foodId]) return {...S.foods[foodId], id: foodId};
  }
  const p = phrase(name), pk = phrase(name, true);
  if(!p) return null;
  const pools = [savedFoods(), builtinFoods()];
  for(const pool of pools){ const f = pool.find(f => f.aliases.includes(p) || f.aliases.includes(pk)); if(f) return f; }
  let best = null, bestLen = 0;
  for(const pool of pools){
    for(const f of pool) for(const a of f.aliases){
      if(a && a.length > bestLen && (' '+pk+' ').includes(' '+a+' ')){ best = f; bestLen = a.length; }
    }
    if(best) return best;
  }
  return null;
}
// One serving of a food: the label serving for brands and label foods, one piece for things
// counted in pieces (an egg), otherwise 100 g.
// Usual serving sizes for the built-in foods (label-style), as [amount, unit].
const SERVING_HINTS = (() => {
  const h = {};
  const set = (names, s) => names.split('|').forEach(n => { h[n] = s; });
  set('olive oil|vegetable oil|coconut oil|butter|honey|maple syrup|soy sauce|teriyaki sauce|heavy cream|chia seed', [1, 'tbsp']);
  set('peanut butter|mayonnaise|ketchup|mustard|bbq sauce|ranch|hot sauce|pesto|salsa|parmesan|sour cream|cream cheese|hummus', [2, 'tbsp']);
  set('salt|black pepper|chili powder|cumin|paprika|garlic powder|onion powder|cinnamon|italian seasoning|basil|thyme|rosemary|red pepper flake|turmeric|curry powder|taco seasoning|baking powder|baking soda|vanilla extract|sugar|cooking spray', [1, 'tsp']);
  set('milk|whole milk|almond milk|oat milk|chicken broth|spinach|kale|broccoli|cauliflower|romaine|blueberry|strawberry|raspberry|grape|pineapple|mixed vegetable|cooked rice|green bean|pea|corn|mushroom', [1, 'cup']);
  set('white rice|brown rice|quinoa|lentil|flour', [0.25, 'cup']);
  set('rolled oat|black bean|chickpea|kidney bean|cottage cheese|marinara|coconut milk|edamame|granola', [0.5, 'cup']);
  set('chicken breast|chicken thigh|ground turkey|ground beef|ground chicken|steak|pork tenderloin|pork chop|salmon|cod|shrimp|tofu', [4, 'oz']);
  set('cheddar|mozzarella|feta|almond|walnut|peanut|cashew|pasta|rice noodle|tortilla chip|chocolate chip|ham|deli turkey|raisin', [1, 'oz']);
  set('greek yogurt', [170, 'g']);
  return h;
})();
function servingOf(food){
  if(!food) return null;
  if(food.source === 'built-in' && SERVING_HINTS[food.name]){
    const [q, u] = SERVING_HINTS[food.name];
    const g = gramsOf(q, u, food);
    if(g > 0) return {g, text: u === 'g' ? `${fq(q)} g` : `${fq(q)} ${u}, ${fq(Math.round(g * 10) / 10)} g`};
  }
  const sg = num(food.servingG);
  if(sg > 0){
    const t = String(food.servingText || '').trim();
    return {g: sg, text: t && !/^[\d.]+\s*(g|ml)$/.test(t) ? `${t}, ${fq(sg)} g` : `${fq(sg)} g`};
  }
  if(num(food.gPerPc) > 0) return {g: num(food.gPerPc), text: `1 piece, ${fq(food.gPerPc)} g`};
  return {g: 100, text: '100 g'};
}
function gramsToUnit(g, unit, food){
  if(unit === 'serving'){ const sv = servingOf(food); return sv ? g / sv.g : null; }
  const u = UNITS[unit]; if(!u) return null;
  if(u[0] === 'mass') return conv(g, 'g', unit);
  if(u[0] === 'vol') return conv(g / (num(food && food.gPerMl) || 1), 'ml', unit);
  return food && num(food.gPerPc) > 0 ? g / num(food.gPerPc) : null;
}
function gramsOf(qty, unit, food){
  if(unit === 'serving'){ const sv = servingOf(food); return sv ? num(qty) * sv.g : null; }
  const u = UNITS[unit]; if(!u) return null;
  if(u[0] === 'mass') return conv(num(qty), unit, 'g');
  if(u[0] === 'vol') return conv(num(qty), unit, 'ml') * (num(food.gPerMl) || 1);
  return food.gPerPc ? num(qty) * num(food.gPerPc) : null;
}
function ingNutrition(ing){
  if(!String(ing.name||'').trim() || !(num(ing.qty) > 0)) return {status:'empty'};
  const food = findFood(ing.name, ing.foodId);
  if(!food) return {status:'unknown'};
  const g = gramsOf(ing.qty, ing.unit, food);
  if(g == null) return {status:'nopc', food};
  const vals = Object.fromEntries(NUTR.map(([k]) => [k, num(food.per100[k]) * g / 100]));
  return {status:'ok', food, grams:g, vals};
}
function recipeCalc(ingredients, servings){
  const lines = (ingredients||[]).map(ingNutrition);
  const total = Object.fromEntries(NUTR.map(([k]) => [k, 0]));
  for(const l of lines) if(l.status === 'ok') for(const k in total) total[k] += l.vals[k];
  const sv = Math.max(1, num(servings) || 1);
  const perServing = Object.fromEntries(Object.entries(total).map(([k,v]) => [k, v/sv]));
  const unknown = (ingredients||[]).filter((i,ix) => lines[ix].status === 'unknown' || lines[ix].status === 'nopc');
  return {lines, total, perServing, unknown};
}
const SRC_LABEL = {'built-in':'typical values', usda:'USDA data', brand:'label data via USDA', claude:'saved values', label:'from your label', manual:'entered by you'};
function ingInfoHtml(line){
  if(!line || line.status === 'empty') return '';

}

/* ---------- food search (typeahead) ---------- */
// A pantry item counts for an ingredient when the names match, or the pantry name is a more
// specific version ending in the same words ("Bell & Evans chicken breast" covers "chicken breast").
function pantryMatches(pName, needName){
  if(key(pName) === key(needName)) return true;
  const a = phrase(pName), b = phrase(needName);
  return !!a && !!b && (a === b || (' ' + a).endsWith(' ' + b));
}
const FDC_KEY = CFG.fdcKey || 'DEMO_KEY';
const NID = {calories:[1008,2047,2048], protein:[1003], carbs:[1005], fat:[1004], fiber:[1079], sugar:[2000,1063], sodium:[1093], cholesterol:[1253], potassium:[1092], calcium:[1087], iron:[1089], vitA:[1106], vitC:[1162], vitD:[1114]};
const SMALL_WORDS = new Set(['and','or','of','with','in','the','a','an','for','to','on']);
function titleCase(s){
  return String(s || '').toLowerCase().split(/(\s+)/).map((w, i) => (i && SMALL_WORDS.has(w)) ? w : w.replace(/^([^a-z]*)([a-z])/, (m, p, c) => p + c.toUpperCase())).join('');
}
function sentenceCase(s){ s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
const HOUSEHOLD_ML = {cup:236.588, cups:236.588, tbsp:14.787, tablespoon:14.787, tablespoons:14.787, tsp:4.929, teaspoon:4.929, teaspoons:4.929, 'fl oz':29.574, floz:29.574};
function densityFrom(text, grams){
  const m = String(text || '').toLowerCase().match(/([\d.\/]+)\s*(cups?|tbsp|tablespoons?|tsp|teaspoons?|fl\.?\s?oz)/);
  if(!m || !(grams > 0)) return null;
  let q = m[1].includes('/') ? m[1].split('/').reduce((a, b) => num(a) / num(b)) : num(m[1]);
  const ml = HOUSEHOLD_ML[m[2].replace('.', '').replace(/\s+/g, ' ')] || HOUSEHOLD_ML[m[2].replace(/[.\s]/g, '')];
  if(!(q > 0) || !ml) return null;
  const d = grams / (q * ml);
  return d > 0.03 && d < 3 ? Math.round(d * 1000) / 1000 : null;
}
function fdcToFood(f){
  const byId = {};
  for(const n of f.foodNutrients || []) if(n && n.value != null && byId[n.nutrientId] == null) byId[n.nutrientId] = num(n.value);
  const get = ids => { for(const id of ids) if(byId[id] != null) return byId[id]; return null; };
  if(get(NID.calories) == null) return null;
  const per100 = Object.fromEntries(NUTR.map(([k]) => [k, r1(get(NID[k]) ?? 0)]));
  if(byId[1106] == null && byId[1104] != null) per100.vitA = r1(byId[1104] * 0.3);
  if(byId[1114] == null && byId[1110] != null) per100.vitD = r1(byId[1110] / 40);
  const branded = f.dataType === 'Branded';
  let desc = String(f.description || '');
  let brand = '';
  if(branded){
    brand = titleCase(f.brandName || f.brandOwner || '');
    for(const b of [f.brandName, f.brandOwner]) if(b && desc.toUpperCase().startsWith(String(b).toUpperCase())){ desc = desc.slice(String(b).length).replace(/^[\s,:;-]+/, ''); break; }
  }
  // "Chicken Breast for Fajitas, Chicken Breast" -> drop a trailing part that repeats earlier words.
  const parts = desc.split(/,\s*/);
  if(parts.length > 1 && parts.slice(0, -1).some(p => p.toLowerCase().includes(parts[parts.length - 1].toLowerCase()))) desc = parts.slice(0, -1).join(', ');
  const unit = String(f.servingSizeUnit || '').toLowerCase();
  const servingG = (unit === 'g' || unit === 'grm' || unit === 'ml' || unit === 'mlt') && num(f.servingSize) > 0 ? r1(f.servingSize) : null;
  return {
    id: 'fdc-' + f.fdcId, fdcId: f.fdcId, upc: f.gtinUpc || null,
    name: branded ? `${brand} ${titleCase(desc)}`.trim() : sentenceCase(desc),
    brand, source: branded ? 'brand' : 'usda', per100,
    servingG, servingText: branded ? String(f.householdServingFullText || '').toLowerCase().replace(/\bonz\b/g, 'oz').replace(/\bgrm\b/g, 'g').trim() : '',
    gPerMl: densityFrom(f.householdServingFullText, servingG) || 1,
    gPerPc: servingG, aliases: [], addedOn: today()
  };
}
const fdcCache = new Map();
let fdcLimited = false;
async function fdcQuery(query, dataType, pageSize, all){
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(FDC_KEY)}&query=${encodeURIComponent(query)}&dataType=${encodeURIComponent(dataType)}&pageSize=${pageSize}&requireAllWords=${all}`;
  const res = await fetch(url);
  if(res.status === 429 || res.status === 403){ fdcLimited = true; throw new Error('limited'); }
  if(!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  return (j.foods || []).map(fdcToFood).filter(Boolean);
}
async function fdcSearch(q, dataType, pageSize, fallback){
  const k = dataType + '|' + pageSize + '|' + !!fallback + '|' + q.toLowerCase();
  if(fdcCache.has(k)) return fdcCache.get(k);
  // Every word must match, and each word also matches longer ones ("thigh" finds "thighs", "kirkl" finds "Kirkland").
  const words = q.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  let foods = await fdcQuery(words.map(w => w.length >= 3 ? w + '*' : w).join(' '), dataType, pageSize, true);
  // Nothing matches every word: fall back to the closest matches.
  if(fallback && !foods.length && words.length > 1) foods = await fdcQuery(words.join(' '), dataType, pageSize, false);
  fdcCache.set(k, foods); fdcLimited = false;
  return foods;
}
function localMatches(q){
  const words = phrase(q, true).split(' ').filter(Boolean);
  if(!words.length) return {mine:[], common:[]};
  const hit = name => { const w = phrase(name, true).split(' '); return words.every(q => w.some(x => x.startsWith(q))); };
  const mine = list('foods').filter(f => hit(f.name)).slice(0, 6).map(f => ({...f, id: f.id}));
  const common = builtinFoods().filter(f => hit(f.name) || f.aliases.some(a => hit(a))).slice(0, 6).map(f => ({...f, id: 'builtin:' + f.name, name: sentenceCase(f.name)}));
  return {mine, common};
}
function foodLine(f){
  const p = f.per100 || {};
  if(f.source === 'brand' && f.servingG){
    const m = f.servingG / 100;
    const st = f.servingText && !/^[\d.]+\s*g$/.test(f.servingText) ? esc(f.servingText) + ' (' + fq(f.servingG) + ' g)' : fq(f.servingG) + ' g';
    return `${fk(p.calories*m)} kcal · ${r1(p.protein*m)} g protein per ${st}`;
  }
  return `${fk(p.calories)} kcal · ${r1(p.protein)} g protein per 100 g`;
}
const SRC_TAG = {'built-in':'Common', usda:'USDA', brand:'Brand', label:'Your label', claude:'Saved', manual:'Saved'};

const suggest = {el:null, input:null, kind:'', items:[], active:-1, q:'', timer:null, seq:0, loading:false, err:''};
function suggestBox(){
  if(!suggest.el){
    suggest.el = document.createElement('div');
    suggest.el.className = 'suggest'; suggest.el.id = 'suggest'; suggest.el.setAttribute('role', 'listbox'); suggest.el.hidden = true;
    document.body.appendChild(suggest.el);
    suggest.el.addEventListener('mousedown', ev => {
      const it = ev.target.closest('[data-pick]'); if(!it) return;
      ev.preventDefault(); pickFood(+it.dataset.pick);
    });
  }
  return suggest.el;
}
function closeSuggest(){ clearTimeout(suggest.timer); suggest.seq++; if(suggest.el) suggest.el.hidden = true; suggest.input = null; suggest.items = []; suggest.active = -1; }
function placeSuggest(){
  const el = suggestBox(), inp = suggest.input && document.getElementById(suggest.input);
  if(!inp){ closeSuggest(); return; }
  const r = inp.getBoundingClientRect();
  const w = Math.min(Math.max(r.width, 360), window.innerWidth - 16);
  el.style.width = w + 'px';
  el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + window.scrollX + 'px';
  el.style.top = r.bottom + window.scrollY + 4 + 'px';
}
function renderSuggest(){
  const el = suggestBox();
  const {mine, common, generic, brands} = suggest.groups || {};
  suggest.items = [...(mine||[]), ...(common||[]), ...(generic||[]), ...(brands||[])];
  let i = 0;
  const sec = (title, arr) => arr && arr.length ? `<div class="sg-h">${title}</div>` + arr.map(f => { const n = i++; return `<div class="sg-item${n === suggest.active ? ' on' : ''}" data-pick="${n}" role="option" id="sg-${n}" aria-selected="${n === suggest.active}">
      <div class="sg-name">${esc(f.name)}</div><div class="sg-sub"><span class="sg-tag">${SRC_TAG[f.source] || 'Saved'}</span>${foodLine(f)}</div></div>`; }).join('') : '';

  if(suggest.loading) html += `<div class="sg-note">Searching brands…</div>`;
  else if(suggest.err) html += `<div class="sg-note">${esc(suggest.err)}</div>`;
  if(!html) html = `<div class="sg-note">No matches yet. Keep typing, or leave it as is.</div>`;
  html += `<div class="sg-foot">Brand data: USDA FoodData Central</div>`;
  el.innerHTML = html; el.hidden = false; placeSuggest();

function openSuggest(inp){
  const q = inp.value.trim();
  suggest.input = inp.id; suggest.kind = inp.dataset.food; suggest.q = q; suggest.active = -1; suggest.err = '';
  if(q.length < 2){ closeSuggest(); return; }
  const loc = localMatches(q);
  suggest.groups = {...loc, generic:[], brands:[]};
  suggest.loading = true; renderSuggest();
  clearTimeout(suggest.timer);
  const seq = ++suggest.seq;
  suggest.timer = setTimeout(async () => {
    try{
      const [generic, brands] = await Promise.all([fdcSearch(q, 'Foundation,SR Legacy', 6, false), fdcSearch(q, 'Branded', 25, true)]);
      if(seq !== suggest.seq) return;
      const seen = new Set();
      const uniq = arr => arr.filter(f => { const k = f.name.toLowerCase() + '|' + fk(f.per100.calories); if(seen.has(k)) return false; seen.add(k); return true; });
      suggest.groups = {...loc, generic: uniq(generic).slice(0, 5), brands: uniq(brands).slice(0, 20)};
      suggest.err = '';
    }catch(e){
      if(seq !== suggest.seq) return;
      suggest.err = fdcLimited ? 'Brand search is busy right now. Try again in a little while.' : 'Brand search needs an internet connection.';
    }
    suggest.loading = false;
    if(suggest.input) renderSuggest();
  }, 350);
}
function pickFood(n){
  const f = suggest.items[n]; if(!f) return;
  const inp = document.getElementById(suggest.input);
  const kind = suggest.kind;
  closeSuggest();
  // Save USDA and brand picks to this person's foods so recipes keep their exact nutrition.
  if(f.source === 'usda' || f.source === 'brand'){
    const {id, ...doc} = f;
    if(!S.foods[id]) put('foods', id, doc);
  }
  const name = f.name;
  if(kind.startsWith('scan:')){
    const it = ui.scan && ui.scan.items[+kind.slice(5)];
    if(it){ it.name = name; it.foodId = f.id; it.cat = guessCat(name); }
    render(); return;
  }
  if(kind.startsWith('recipe:')){
    const ing = ui.rEdit && ui.rEdit.ingredients[+kind.slice(7)];
    if(ing){
      ing.name = name; ing.foodId = f.id;
      // A new pick starts at 1 serving; an amount already typed is kept.
      if(!ing.qty || ing.unit === 'serving'){ ing.qty = ing.qty || '1'; ing.unit = 'serving'; }
    }
    render();
    const q = document.getElementById(`f-rEdit-ingredients-${kind.slice(7)}-qty`); if(q){ q.focus(); q.select && q.select(); }
    return;
  }
  const bind = inp && inp.dataset.bind;
  if(bind){ setPath(ui, bind, name); const base = bind.split('.')[0]; if(ui[base] && typeof ui[base] === 'object') ui[base].foodId = f.id; }
  if(inp){ inp.value = name; inp.focus(); }
}
document.addEventListener('input', ev => {
  const inp = ev.target.closest && ev.target.closest('[data-food]');
  if(!inp) return;
  const kind = inp.dataset.food;
  if(kind.startsWith('recipe:') && ui.rEdit){ const ing = ui.rEdit.ingredients[+kind.slice(7)]; if(ing) ing.foodId = null; }
  else { const b = inp.dataset.bind && inp.dataset.bind.split('.')[0]; if(b && ui[b]) ui[b].foodId = null; }
  openSuggest(inp);
});
document.addEventListener('keydown', ev => {
  if(!suggest.input || suggest.el.hidden || ev.target.id !== suggest.input) return;
  const n = suggest.items.length;
  if(ev.key === 'ArrowDown' && n){ ev.preventDefault(); suggest.active = (suggest.active + 1) % n; renderSuggest(); document.getElementById('sg-' + suggest.active)?.scrollIntoView({block:'nearest'}); }
  else if(ev.key === 'ArrowUp' && n){ ev.preventDefault(); suggest.active = (suggest.active - 1 + n) % n; renderSuggest(); document.getElementById('sg-' + suggest.active)?.scrollIntoView({block:'nearest'}); }
  else if(ev.key === 'Enter' && suggest.active >= 0){ ev.preventDefault(); ev.stopImmediatePropagation(); pickFood(suggest.active); }
  else if(ev.key === 'Escape'){ closeSuggest(); }
  else if(ev.key === 'Enter'){ closeSuggest(); }
}, true);
document.addEventListener('focusout', ev => { if(ev.target.id && ev.target.id === suggest.input) setTimeout(() => { if(document.activeElement && document.activeElement.id === suggest.input) return; closeSuggest(); }, 120); });

const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
function loadScript(src){

// Shrink big photos, enlarge tiny ones, convert to grayscale and stretch the contrast so faded
// thermal-paper print reads better.
async function prepImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }catch(e){ bmp = await createImageBitmap(file); }
  const long = Math.max(bmp.width, bmp.height);
  const sc = long > 2400 ? 2400 / long : (long < 1400 ? 1400 / long : 1);
  const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d', {willReadFrequently: true});
  c.drawImage(bmp, 0, 0, w, h);
  const img = c.getImageData(0, 0, w, h), d = img.data, hist = new Uint32Array(256);
  for(let i = 0; i < d.length; i += 4){ const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; d[i] = d[i + 1] = d[i + 2] = g; hist[g]++; }
  const total = w * h; let lo = 0, hi = 255, acc = 0;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc > total * 0.02){ lo = v; break; } }
  acc = 0;
  for(let v = 255; v >= 0; v--){ acc += hist[v]; if(acc > total * 0.02){ hi = v; break; } }
  const span = Math.max(1, hi - lo);
  for(let i = 0; i < d.length; i += 4){ const g = Math.max(0, Math.min(255, (d[i] - lo) * 255 / span)); d[i] = d[i + 1] = d[i + 2] = g; }
  c.putImageData(img, 0, 0);
  return cv;
}

function expandReceiptName(raw){
  const words = raw.toUpperCase().replace(/[^A-Z0-9&%' ]+/g, ' ').split(/\s+/).filter(Boolean);

  for(const w of words){
    if(/^\d+$/.test(w) && w.length >= 4) continue;           // item codes
    if(Object.prototype.hasOwnProperty.call(RECEIPT_WORDS, w)){ if(RECEIPT_WORDS[w]) out.push(RECEIPT_WORDS[w]); continue; }
    out.push(w.length <= 2 && !/\d/.test(w) ? w : w.toLowerCase());
  }
  // Drop words repeated by an expansion ("OLV OIL EVOO" -> "olive oil extra virgin").
  const seen = new Set();
  let s = out.join(' ').split(' ').filter(w => { const k = w.toLowerCase(); if(/\d/.test(k) || !seen.has(k)){ seen.add(k); return true; } return false; }).join(' ').replace(/\s+/g, ' ').trim();

  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

    if(prev && weight && letters <= 6){ const q = sizeToQty(weight[1], weight[2]); if(q){ prev.qty = String(q.qty); prev.unit = q.unit; } continue; }

    if(!name || name.replace(/[^a-z]/gi, '').length < 3) continue;
    const nonFood = NON_FOOD.test(name.toLowerCase());

const SCAN_STEPS = {'loading tesseract core':'Getting the text reader ready (first time only)…', 'initializing tesseract':'Getting the text reader ready…', 'loading language traineddata':'Downloading English text data (first time only)…', 'initializing api':'Getting the text reader ready…', 'recognizing text':'Reading your receipt…'};
async function runScan(file){

    const canvas = await prepImage(file);
    if(!window.Tesseract) await loadScript(TESS_SRC);
    const worker = await Tesseract.createWorker('eng', 1, {logger: m => {
      if(ui.scan !== s) return;
      s.status = SCAN_STEPS[m.status] || s.status;

      updateScanProgress();

    await worker.setParameters({tessedit_pageseg_mode: '6', preserve_interword_spaces: '1'});

    let best = {data, items: parseReceipt(data.text)};

      await worker.setParameters({tessedit_pageseg_mode: '4'});
      const second = (await worker.recognize(canvas)).data;
      const items2 = parseReceipt(second.text);
      if(items2.length > best.items.length) best = {data: second, items: items2};
    }
    await worker.terminate();
    if(ui.scan !== s) return;
    s.raw = best.data.text || ''; s.conf = Math.round(num(best.data.confidence));

    s.lowQuality = s.conf < 40;

    s.stage = 'error';

  if(s.stage === 'pick') return head + `
    <div class="card stack scanpick">

    </div>`;
  if(s.stage === 'reading') return head + `
    <div class="card stack">

    <div class="card stack">
      <div class="cardhead" style="margin-bottom:0"><h2>${s.items.length ? `Found ${s.items.length} item${s.items.length === 1 ? '' : 's'}` : 'No items found'}</h2>

        <div class="scanrow${it.on ? '' : ' off'}">

          </div>
          <div class="scanqty">

            <select id="f-scan-items-${ix}-unit" class="w-unit" data-bind="scan.items.${ix}.unit" aria-label="Unit">${opts(UNIT_LIST, it.unit)}</select>

      <div class="row">
        <button class="btn sm" data-act="scanAddLine">Add a line</button>
        <span class="spacer"></span>
        ${s.items.length ? `<span class="small muted">Ticked items: <b>$${sum.toFixed(2)}</b>. Compare with your receipt's subtotal to spot missed items.</span>` : ''}
      </div>
      <div class="row">

    </div>`;

    if(e.date !== date || e.status === 'skipped') continue;

  }
  return t;
}

/* ----- Recipes ----- */
function macroBlock(n, mult=1){
  const p = num(n.protein)*mult, c = num(n.carbs)*mult, f = num(n.fat)*mult;
  const tot = p*4 + c*4 + f*9 || 1;
  return `
    <div class="row" style="align-items:baseline;gap:8px"><span class="kcal">${fk(num(n.calories)*mult)}</span><span class="muted">kcal</span></div>
    <div class="mbar" role="img" aria-label="Calories from protein ${Math.round(p*400/tot)}%, carbs ${Math.round(c*400/tot)}%, fat ${Math.round(f*900/tot)}%">
      <i style="width:${p*400/tot}%;background:var(--protein)"></i><i style="width:${c*400/tot}%;background:var(--carbs)"></i><i style="width:${f*900/tot}%;background:var(--fat)"></i>
    </div>
    <div class="macros">
      <div class="macro"><b>${fq(p)} g</b><span><i class="sw" style="background:var(--protein)"></i>Protein · ${Math.round(p*400/tot)}%</span></div>
      <div class="macro"><b>${fq(c)} g</b><span><i class="sw" style="background:var(--carbs)"></i>Carbs · ${Math.round(c*400/tot)}%</span></div>
      <div class="macro"><b>${fq(f)} g</b><span><i class="sw" style="background:var(--fat)"></i>Fat · ${Math.round(f*900/tot)}%</span></div>
    </div>`;
}
function ingList(checks){
  if(!checks.length) return `<div class="empty">No ingredients listed.</div>`;
  return `<div>${checks.map(c => `
    <div class="ing">
      <span class="ic ${c.status}" aria-hidden="true">${c.status==='ok'?'✓':c.status==='short'?'!':'✕'}</span>
      <div><div><b>${c.srv ? `${fq(c.srv.qty)} serving${c.srv.qty === 1 ? '' : 's'}` : `${niceQty(c.qty,c.unit)} ${esc(c.unit)}`}</b> ${esc(c.name)}</div>
        <div class="have">${c.srv ? `1 serving = ${esc(c.srv.text)} · ` : ''}${c.mismatch ? 'In pantry under a different kind of unit' : `Have ${fq(c.have)} ${esc(c.unit)}`}</div></div>
      <span>${c.status==='ok' ? '<span class="pill ok">Have it</span>' : c.status==='short' ? `<span class="pill warn">Short ${niceQty(c.gap,c.unit)} ${esc(c.unit)}</span>` : '<span class="pill bad">Missing</span>'}</span>
    </div>`).join('')}</div>`;
}

/* ----- Plan my week (randomizer) ----- */
// Which meals a recipe suits: its "Good for" tags, or a guess from its name.
function recipeSlots(r){
  if(Array.isArray(r.meals) && r.meals.length) return SLOTS.filter(s => r.meals.includes(s));
  const n = String(r.name || '');
  if(/oat|egg|pancake|waffle|muffin|smoothie|breakfast|granola|parfait|frittata|french toast|bagel|chia pudding/i.test(n)) return ['Breakfast'];
  if(/snack|bites|\bbars?\b|hummus|trail mix|energy ball|protein ball/i.test(n)) return ['Snack'];
  return ['Lunch', 'Dinner'];
}
// A throwaway copy of the pantry, so planning can "use up" ingredients without saving anything.
function simHave(pan, name, unit){ let h = 0; for(const p of pan){ if(!pantryMatches(p.name, name)) continue; const c = conv(p.qty, p.unit, unit); if(c != null && c > 0) h += c; } return h; }
function simTake(pan, name, unit, qty){
  let left = qty;
  for(const p of pan){
    if(left <= 1e-9) break;
    if(!pantryMatches(p.name, name)) continue;
    const a = conv(p.qty, p.unit, unit); if(a == null || a <= 0) continue;
    const t = Math.min(a, left); left -= t; p.qty -= conv(t, unit, p.unit);
  }
}
function randScore(r, portions, pan, used, activeIds, prevId){
  const miss = scaled(r, portions).filter(n => simHave(pan, n.name, n.unit) < n.qty - 1e-6).length;
  // Having everything helps, but repeating the meal right before it in the same slot costs more, so plans rotate.
  return Math.random() * 1.2 + (miss === 0 ? 1 : 0) - miss * 0.2 - (used.get(r.id) || 0) * 0.6 - (r.id === prevId ? 0.8 : 0) - (activeIds.has(r.id) ? 0.4 : 0);
}
// Recompute what each batch is missing, in order, as earlier batches use up the pantry.
function randMissing(batches){
  const pan = list('pantry').map(p => ({...p, qty: num(p.qty)}));
  for(const b of batches){
    const r = S.recipes[b.recipeId];
    const needs = r ? scaled(r, b.portions) : [];
    b.missing = needs.map(n => ({name: n.name, unit: n.unit, qty: Math.max(0, n.qty - simHave(pan, n.name, n.unit))})).filter(n => n.qty > 1e-6);
    needs.forEach(n => simTake(pan, n.name, n.unit, n.qty));
  }
}
function makeRandomPlan(){
  const o = ui.rand, fd = Math.max(1, num(prefs().fridgeDays) || 4);
  const days = Array.from({length: Math.max(1, Math.min(14, num(o.days) || 5))}, (_, i) => addDays(o.start || today(), i));
  const slots = SLOTS.filter(s => o.slots[s]);
  const pan = list('pantry').map(p => ({...p, qty: num(p.qty)}));
  const used = new Map(), activeIds = new Set(activePreps().map(p => p.recipeId));
  const plan = list('plan'), batches = [], notes = [];
  for(const slot of slots){
    const cands = recipesSorted().filter(r => recipeSlots(r).includes(slot));
    if(!cands.length){ notes.push(`No recipes for ${slot.toLowerCase()} yet. Add one, or tick ${slot} under “Good for” on a recipe.`); continue; }
    // Free days for this meal, split into runs of consecutive days.
    const free = days.filter(d => !plan.some(e => e.date === d && e.slot === slot && e.status !== 'skipped'));
    if(free.length < days.length) notes.push(`${days.length - free.length} ${slot.toLowerCase()}${days.length - free.length === 1 ? ' is' : 's are'} already planned, so ${days.length - free.length === 1 ? 'it was' : 'they were'} left as is.`);
    const runs = [];
    for(const d of free){ const last = runs[runs.length - 1]; if(last && addDays(last[last.length - 1], 1) === d) last.push(d); else runs.push([d]); }
    // Each run becomes as few batches as possible, none longer than the fridge limit, sized evenly (5 days -> 3 + 2).
    for(const run of runs){
      const n = Math.ceil(run.length / fd), base = Math.floor(run.length / n), extra = run.length % n;
      let at = 0;
      for(let b = 0; b < n; b++){
        const len = base + (b < extra ? 1 : 0), chunk = run.slice(at, at + len); at += len;
        let best = null, bestScore = -1e9;
        const prevId = (batches.filter(x => x.slot === slot).slice(-1)[0] || {}).recipeId;
        for(const r of cands){ const sc = randScore(r, len, pan, used, activeIds, prevId); if(sc > bestScore){ bestScore = sc; best = r; } }
        scaled(best, len).forEach(x => simTake(pan, x.name, x.unit, x.qty));
        used.set(best.id, (used.get(best.id) || 0) + 1);
        batches.push({id: uid('b'), recipeId: best.id, name: best.name, slot, days: chunk, portions: len, cookDate: chunk[0]});
      }
    }
  }
  randMissing(batches);
  return {batches, notes};
}
function dayRange(ds){ const a = fmtD(ds[0], {weekday: 'short'}), b = fmtD(ds[ds.length - 1], {weekday: 'short'}); return ds.length === 1 ? `${a} ${fmtD(ds[0], {month: 'short', day: 'numeric'})}` : `${a}–${b}`; }
function viewRandomizer(){
  const o = ui.rand, p = o.plan;

    <p class="small muted">Picks recipes for the meals you choose and spreads them over the days, favoring recipes you have the ingredients for. No batch stays in the fridge longer than ${fq(prefs().fridgeDays)} days (change that in Settings).</p>
    <div class="row end">

      <label class="f">For<select id="f-rand-days" data-bind="rand.days" data-norender>${opts(Array.from({length: 14}, (_, i) => [String(i + 1), `${i + 1} day${i ? 's' : ''}`]), o.days)}</select></label>

    ${p ? `

          <button class="btn sm" data-act="randSwap" data-ix="${ix}" ${(list('recipes').filter(r => recipeSlots(r).includes(b.slot)).length > 1) ? '' : 'disabled'} title="Pick a different recipe for this batch">Swap</button>

        ${needBuy ? `<label class="check"><input type="checkbox" id="f-rand-addMissing" data-bind="rand.addMissing" ${o.addMissing ? 'checked' : ''}>Add everything I need to buy to my shopping list</label>` : '<p class="small"><b>Your pantry covers this whole plan.</b></p>'}
        <div class="row"><button class="btn primary" data-act="randUse">Use this plan</button><button class="btn" data-act="randMake">Shuffle again</button></div>` : ''}` : ''}
  </div>`;
}

/* ----- Fridge ----- */

  const planned = list('preps').filter(p => p.status === 'planned').sort((a,b) => String(a.cookDate).localeCompare(b.cookDate));
  const total = cooked.reduce((s,p) => s + num(p.remaining), 0);
  return `
  <div class="pagehead">
    <div><h1>Fridge</h1><p class="sub">Prepped meals ready to eat. A portion comes off when you confirm you ate it in Notifications, or when you tap Ate one.</p></div>

  ${cooked.length ? `<div class="fridge">${cooked.map(p => {
    const age = daysBetween(p.cookedOn || t, t);

    return `<div class="card fitem">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><h2>${esc(prepName(p))}</h2>${age >= num(prefs().fridgeDays) ? `<span class="pill ${age > num(prefs().fridgeDays) ? 'bad' : 'warn'}">Day ${age+1} in fridge</span>` : `<span class="pill">Day ${age+1} in fridge</span>`}</div>
      <div class="count">${fq(p.remaining)}<small>of ${fq(p.portions)} left</small></div>
      <div class="portions" aria-hidden="true">${Array.from({length:Math.ceil(num(p.remaining))}, (_,i) => `<i class="${i < sch ? 'sched' : ''}"></i>`).join('')}</div>
      <p class="small muted">${sch} on the calendar · ${Math.max(0, num(p.remaining) - sch)} unscheduled · prepped ${fmtD(p.cookedOn || t)} · ${fk(n.calories)} kcal each</p>

    </div>`; }).join('')}</div>` : `<div class="empty">The fridge is empty. Create a prep in the Planner and mark it cooked.</div>`}
  ${planned.length ? `<div class="card"><h2>Coming soon</h2>${planned.map(p => `<div class="listrow"><div><b>${esc(prepName(p))}</b> <span class="muted small">· ${fq(p.portions)} portions · cook ${fmtD(p.cookDate)}</span></div><button class="btn sm primary" data-act="prepCook" data-id="${p.id}">Mark cooked</button></div>`).join('')}</div>` : ''}
  <p class="small muted">Legend: <i class="sw" style="background:var(--butter)"></i> scheduled on the calendar &nbsp; <i class="sw" style="background:var(--accent)"></i> not scheduled yet</p>`;
}

        <div class="row"><button class="btn primary" data-act="noteYes" data-id="${e.id}">Yes, I ate it</button><button class="btn" data-act="noteNo" data-id="${e.id}">No</button></div>`}
    </div>`).join('')}</div>` : `<div class="empty">You're all caught up.</div>`}
  ${upcoming.length ? `<div class="card"><h2>Coming up</h2>${upcoming.map(e => `<div class="listrow"><span><b>${esc(nameOf(e))}</b> <span class="muted small">· ${esc(e.slot)}, ${fmtD(e.date)}</span></span></div>`).join('')}</div>` : ''}
  ${answered.length ? `<div class="card"><h2>Recent answers</h2>${answered.map(e => `<div class="listrow">
      <span><span class="pill ${e.status==='eaten'?'ok':''}">${e.status==='eaten'?'Ate it':'Skipped'}</span> <b>${esc(nameOf(e))}</b> <span class="muted small">· ${esc(e.slot)}, ${fmtD(e.date)}</span></span>
      <button class="btn sm ghost" data-act="noteUndo" data-id="${e.id}">Undo</button></div>`).join('')}</div>` : ''}`;
}

/* ----- Groceries ----- */
function viewGroceries(){
  const t = today();
  const planned = list('preps').filter(p => p.status === 'planned');
  const needs = mergeNeeds(planned.flatMap(p => S.recipes[p.recipeId] ? scaled(S.recipes[p.recipeId], p.portions) : []));
  const short = checkNeeds(needs).filter(c => c.status !== 'ok');
  const low = list('pantry').filter(isLow).filter(p => !short.some(s => key(s.name) === key(p.name)));
  const plan = list('plan');
  const emptyDays = Array.from({length:7}, (_,i) => addDays(t,i)).filter(d => !plan.some(e => e.date === d && e.status !== 'skipped'));
  const unsched = activePreps().reduce((s,p) => s + Math.max(0, portionsLeft(p) - scheduledFor(p.id)), 0);
  const activeIds = new Set(activePreps().map(p => p.recipeId));
  const ideas = recipesSorted().map(r => ({r, miss: missingOf(recipeCheck(r))})).sort((a,b) => (activeIds.has(a.r.id) - activeIds.has(b.r.id)) || a.miss.length - b.miss.length);
  const shop = list('shopping').sort((a,b) => (a.checked - b.checked) || String(a.name).localeCompare(b.name));
  const checkedN = shop.filter(s => s.checked).length;
  const names = [...new Set([...list('pantry').map(p=>p.name), ...list('recipes').flatMap(r=>(r.ingredients||[]).map(i=>i.name))])].sort();
  const gl = (nm, det, q, u) => `<div class="gline"><div><div class="nm">${esc(nm)}</div><div class="det">${det}</div></div>
      <span class="small"><b>${niceQty(q,u)} ${esc(u)}</b></span>
      ${onList(nm) ? '<span class="pill ok">On list</span>' : `<button class="btn sm" data-act="listAdd" data-name="${esc(nm)}" data-qty="${niceQty(q,u)}" data-unit="${esc(u)}">Add</button>`}</div>`;
  return `
  <div class="pagehead"><div><h1>Groceries</h1><p class="sub">What to buy for the preps you've planned, ideas from your recipes, your list, and a place to log what you bought.</p></div></div>
  <div class="cols2">
    <div class="stack">
      <div class="card">
        <div class="cardhead"><h2>Buy for your planned preps</h2>${short.some(s=>!onList(s.name)) ? `<button class="btn sm primary" data-act="listAll">Add all</button>` : ''}</div>
        ${planned.length ? `<p class="small muted" style="margin-bottom:6px">For ${planned.map(p => `${esc(prepName(p))} (${fq(p.portions)}, ${fmtD(p.cookDate)})`).join(', ')}</p>` : ''}
        ${short.length ? short.map(s => gl(s.name, `Need ${niceQty(s.qty,s.unit)} ${esc(s.unit)} · have ${fq(s.have)}`, s.gap, s.unit)).join('')
          : `<div class="empty">${planned.length ? 'Your pantry covers every planned prep.' : 'No preps planned. Create one in the Planner to see what to buy.'}</div>`}
      </div>
      <div class="card">
        <h2>Running low</h2>
        ${low.length ? low.map(p => gl(p.name, num(p.qty) <= 0 ? 'Out' : `Down to ${fq(p.qty)} ${esc(p.unit)}${p.lowAt!=null && p.lowAt!=='' ? ` (low at ${fq(p.lowAt)})` : ''}`, Math.max(num(p.lowAt)*2 - num(p.qty), STEP[p.unit] || 1), p.unit)).join('') : '<div class="empty">Nothing is running low.</div>'}
      </div>
      <div class="card">
        <h2>Fridge check</h2>
        <p class="small">${fq(unsched)} prepped portion${unsched===1?'':'s'} not on the calendar yet. ${emptyDays.length ? `${emptyDays.length} of the next 7 days have no meals planned (${emptyDays.slice(0,4).map(d=>fmtD(d,{weekday:'short'})).join(', ')}${emptyDays.length>4?'…':''}).` : 'Every day in the next week has at least one meal.'}</p>
      </div>
      <div class="card">
        <h2>Recipes you could prep</h2>
        <p class="small muted" style="margin-bottom:6px">Meals not already in your fridge come first, then those you're closest to having everything for.</p>
        ${ideas.length ? ideas.map(({r,miss}) => `<div class="gline" style="grid-template-columns:minmax(0,1fr) auto">
            <div><div class="nm">${esc(r.name)} ${activeIds.has(r.id) ? '<span class="pill">Already prepped</span>' : ''}</div>
            <div class="det">${miss.length ? 'Need ' + miss.map(m => `${esc(m.name)} (${niceQty(m.gap,m.unit)} ${esc(m.unit)})`).join(', ') : 'You have everything for a full batch'} · ${fk(nutr(r).calories)} kcal, ${fq(nutr(r).protein)} g protein</div></div>
            <div class="row">${miss.length ? `<button class="btn sm" data-act="listMissing" data-id="${r.id}" data-portions="${r.servings}">Add missing</button>` : ''}<button class="btn sm primary" data-act="prepThis" data-id="${r.id}">Plan prep</button></div>
          </div>`).join('') : '<div class="empty">Add recipes to get ideas here.</div>'}
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="cardhead"><h2>Shopping list</h2>${checkedN ? `<button class="btn sm primary" data-act="putAway">Put ${checkedN} checked in pantry</button>` : ''}</div>
        ${shop.length ? shop.map(s => `<div class="shop${s.checked?' done':''}">
            <input type="checkbox" id="sc-${s.id}" data-change="shopCheck" data-id="${s.id}" ${s.checked?'checked':''} aria-label="Bought ${esc(s.name)}">
            <label for="sc-${s.id}"><span class="nm" style="font-weight:600">${esc(s.name)}</span> <span class="muted small">${fq(s.qty)} ${esc(s.unit)}</span></label>
            ${confirmBtn('shopping:'+s.id)}
          </div>`).join('') : '<div class="empty">Your list is empty. Add suggestions from the left or type an item below.</div>'}
        <div class="row end" style="margin-top:12px">
          <label class="f" style="flex:1 1 150px">Item<input id="f-listNew-name" data-food="list" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" value="${esc(ui.listNew.name)}" data-bind="listNew.name" data-norender></label>
          <label class="f">Amount<input id="f-listNew-qty" class="w-num" type="number" step="any" min="0" value="${esc(ui.listNew.qty)}" data-bind="listNew.qty" data-norender></label>
          <label class="f">Unit<select id="f-listNew-unit" class="w-unit" data-bind="listNew.unit" data-norender>${opts(UNIT_LIST, ui.listNew.unit)}</select></label>
          <button class="btn" data-act="listNew">Add to list</button>
        </div>
        <p class="small muted" style="margin-top:10px">Tick items as you shop, then put them in the pantry in one go.</p>
      </div>
      <div class="card">
        <div class="cardhead"><h2>Log a purchase</h2><div class="row"><button class="btn sm primary" data-act="bcOpen">Scan barcodes</button><button class="btn sm" data-act="scanOpen">Scan a receipt</button></div></div>
        <p class="small muted" style="margin-bottom:10px">Bought something that wasn't on the list? Add it straight to your pantry. If an item with the same name exists, the amount is added to it.</p>
        <datalist id="gnames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div class="row end">
          <label class="f" style="flex:1 1 150px">Item<input id="f-buy-name" data-food="buy" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" value="${esc(ui.buy.name)}" data-bind="buy.name" data-norender placeholder="e.g. Chicken breast"></label>
          <label class="f">Amount<input id="f-buy-qty" class="w-num" type="number" step="any" min="0" value="${esc(ui.buy.qty)}" data-bind="buy.qty" data-norender></label>
          <label class="f">Unit<select id="f-buy-unit" class="w-unit" data-bind="buy.unit" data-norender>${opts(UNIT_LIST, ui.buy.unit)}</select></label>
          <label class="f">Category<select id="f-buy-category" data-bind="buy.category" data-norender>${opts(CATS, ui.buy.category)}</select></label>
          <button class="btn primary" data-act="buyLog">Add to pantry</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }
let confirmT;
function eatPortion(prepId){ const p = S.preps[prepId]; if(p && p.status === 'cooked') patch('preps', prepId, {remaining: Math.max(0, num(p.remaining) - 1)}); }
function deletePrep(id){ list('plan').filter(e => e.prepId === id && e.status === 'planned').forEach(e => remove('plan', e.id)); remove('preps', id); }
function cookPrep(id){
  const p = S.preps[id]; const r = S.recipes[p.recipeId];
  if(r) deduct(scaled(r, p.portions));
  patch('preps', id, {status:'cooked', cookedOn: today(), remaining: num(p.portions)});
  toast(`${prepName(p)} is in the fridge. Pantry updated.`);
}

const ACT = {
  rMeal: el => { const m = ui.rEdit.meals || (ui.rEdit.meals = []); const v = el.dataset.v; const i = m.indexOf(v); if(i >= 0) m.splice(i, 1); else m.push(v); },
  randGo: () => { ui.tab = 'planner'; lsSet('pk-tab', 'planner'); setTimeout(() => { const c = document.getElementById('randcard'); if(c) c.scrollIntoView({block: 'start', behavior: 'smooth'}); }, 60); },
  randSlot: el => { ui.rand.slots[el.dataset.v] = !ui.rand.slots[el.dataset.v]; },
  randClear: () => { ui.rand.plan = null; },
  randMake: () => {
    if(!SLOTS.some(s => ui.rand.slots[s])){ toast('Pick at least one meal to plan.'); return; }
    ui.rand.plan = makeRandomPlan();
    if(!ui.rand.plan.batches.length && !ui.rand.plan.notes.length) toast('Every meal in those days is already planned.');
  },
  randSwap: el => {
    const p = ui.rand.plan, ix = +el.dataset.ix, b = p && p.batches[ix];
    if(!b) return;
    const cands = recipesSorted().filter(r => recipeSlots(r).includes(b.slot) && r.id !== b.recipeId);
    if(!cands.length) return;
    const used = new Map(), activeIds = new Set(activePreps().map(x => x.recipeId));
    p.batches.forEach((x, i) => { if(i !== ix) used.set(x.recipeId, (used.get(x.recipeId) || 0) + 1); });
    const pan = list('pantry').map(x => ({...x, qty: num(x.qty)}));
    p.batches.slice(0, ix).forEach(x => { const r = S.recipes[x.recipeId]; if(r) scaled(r, x.portions).forEach(n => simTake(pan, n.name, n.unit, n.qty)); });
    let best = null, bestScore = -1e9;
    const prevId = (p.batches.slice(0, ix).filter(x => x.slot === b.slot).slice(-1)[0] || {}).recipeId;
    for(const r of cands){ const sc = randScore(r, b.portions, pan, used, activeIds, prevId); if(sc > bestScore){ bestScore = sc; best = r; } }
    b.recipeId = best.id; b.name = best.name;
    randMissing(p.batches);
  },
  randUse: () => {
    const p = ui.rand.plan; if(!p || !p.batches.length) return;
    for(const b of p.batches){
      const prepId = uid('prep');
      put('preps', prepId, {recipeId: b.recipeId, recipeName: b.name, portions: b.portions, cookDate: b.cookDate, status: 'planned', remaining: 0, createdOn: today()});
      for(const d of b.days) put('plan', uid('m'), {date: d, slot: b.slot, prepId, recipeId: b.recipeId, name: b.name, status: 'planned'});
    }
    let listed = 0;
    if(ui.rand.addMissing){
      for(const m of mergeNeeds(p.batches.flatMap(b => b.missing))){
        if(onList(m.name)) continue;
        addToList(m.name, m.unit === 'pc' ? Math.ceil(m.qty - 1e-6) : Math.round(m.qty * 100) / 100, m.unit); listed++;
      }
    }
    ui.week = weekStart(p.batches[0].days[0]);
    toast(`Planned ${p.batches.length} batch${p.batches.length === 1 ? '' : 'es'}${listed ? ` and added ${listed} item${listed === 1 ? '' : 's'} to your shopping list` : ''}. Mark each one cooked when you make it.`);
    ui.rand.plan = null;
  },
  bcOpen: () => { openBarcode(); },
  bcClose: () => closeBarcode(),
  bcDest: el => { bc.dest = el.dataset.v; lsSet('pk-bc-dest', bc.dest); renderBcTop(); renderBcSheet(); },
  bcSkip: () => bcResume(),
  bcMore: () => {
    const it = bc.item; if(!it) return;
    const b = it.base, add = it.unit === b.unit ? num(b.qty) : conv(num(b.qty), b.unit, it.unit);
    if(add == null){ toast('Switch the unit back to add another package.'); return; }
    it.qty = String(Math.round((num(it.qty) + add) * 100) / 100);
    const q = document.getElementById('f-bcItem-qty'); if(q) q.value = it.qty;
  },
  bcManual: async () => {
    const v = (document.getElementById('f-bc-manual') || {}).value || '';
    const code = v.replace(/\D/g, '');
    if(code.length < 8){ toast('Enter the full number under the barcode (8 to 14 digits).'); return; }
    await onBarcode(code);
  },
  bcAdd: () => {
    const it = bc.item; if(!it) return;
    const name = String(it.name || '').trim(), qty = num(it.qty);
    if(!name){ toast('Give the product a name first.'); return; }
    if(!(qty > 0)){ toast('Enter how much you have.'); return; }
    // Remember the product (and its barcode) in this person's foods.
    let foodId = it.foodId || null;
    if(it.food && !foodId){
      const {id, hasNutrition, image, quantityText, pkg, category, ...doc} = it.food;
      foodId = id; put('foods', id, {...doc, name, upc: it.code});
    } else if(!it.food && !foodId){
      foodId = 'upc-' + codeKey(it.code);
      put('foods', foodId, {name, upc: it.code, aliases: [], per100: Object.fromEntries(NUTR.map(([k]) => [k, 0])), gPerMl: 1, gPerPc: null, source: 'manual', addedOn: today()});
    } else if(foodId && S.foods[foodId] && !S.foods[foodId].upc){
      patch('foods', foodId, {upc: it.code});
    }
    if(bc.dest === 'list'){ addToList(name, qty, it.unit); }
    else {
      const m = list('pantry').find(p => p.foodId && p.foodId === foodId && conv(1, it.unit, p.unit) !== null) || scanPantryMatch(name, it.unit);
      if(m) patch('pantry', m.id, {qty: Math.round((num(m.qty) + conv(qty, it.unit, m.unit)) * 1000) / 1000});
      else put('pantry', uid('p'), {name, qty, unit: it.unit, category: it.category || guessCat(name), lowAt: null, foodId});
    }
    bc.added.push(`${name} (${fq(qty)} ${it.unit})`);
    bcResume();
  },
  scanOpen: () => { ui.scanFrom = ui.tab === 'scan' ? (ui.scanFrom || 'pantry') : ui.tab; ui.scan = {stage: 'pick'}; ui.tab = 'scan'; window.scrollTo(0, 0); },
  scanClose: () => { if(ui.scan && ui.scan.imgUrl) URL.revokeObjectURL(ui.scan.imgUrl); ui.scan = null; ui.tab = ui.scanFrom || 'pantry'; window.scrollTo(0, 0); },
  scanCancel: () => { ui.scan = {stage: 'pick'}; },
  scanRestart: () => { if(ui.scan && ui.scan.imgUrl) URL.revokeObjectURL(ui.scan.imgUrl); ui.scan = {stage: 'pick'}; window.scrollTo(0, 0); },
  scanRaw: () => { ui.scan.showRaw = !ui.scan.showRaw; },
  scanAddLine: () => { ui.scan.items.push({on: true, name: '', qty: '1', unit: 'pc', price: 0, raw: 'added by you', cat: 'Other'}); },
  scanAdd: () => {
    const items = ui.scan.items.filter(i => i.on && i.name.trim() && num(i.qty) > 0);
    let merged = 0, fresh = 0, listed = 0;
    for(const it of items){
      const name = it.name.trim(), qty = num(it.qty), m = scanPantryMatch(name, it.unit);
      if(m){ patch('pantry', m.id, {qty: Math.round((num(m.qty) + conv(qty, it.unit, m.unit)) * 1000) / 1000}); merged++; }
      else { put('pantry', uid('p'), {name, qty, unit: it.unit, category: it.cat || guessCat(name), lowAt: null, ...(it.foodId ? {foodId: it.foodId} : {})}); fresh++; }
      // Bought now, so it comes off the shopping list.
      for(const sh of list('shopping')) if(!sh.checked && (pantryMatches(name, sh.name) || pantryMatches(sh.name, name))){ remove('shopping', sh.id); listed++; }
    }
    toast(`Added ${items.length} item${items.length === 1 ? '' : 's'} to your pantry${merged ? ` (${merged} added to items you already had)` : ''}${listed ? `. ${listed} crossed off your shopping list` : ''}.`);
    if(ui.scan.imgUrl) URL.revokeObjectURL(ui.scan.imgUrl);
    ui.scan = null; ui.tab = 'pantry'; window.scrollTo(0, 0);
  },
  moreOpen: () => { document.getElementById('moresheet').hidden = false; document.getElementById('sheetback').hidden = false; },
  moreClose: () => closeMore(),
  phoneTab: el => {
    const id = el.dataset.id, cur = phoneTabs();

  },

  go: el => ACT.tab(el),
  goWeek: el => { ui.week = weekStart(el.dataset.date); ui.tab = 'planner'; lsSet('pk-tab','planner'); window.scrollTo(0,0); },

  goalsCancel: () => { ui.goalsEdit = false; },

    else { put('pantry', uid('p'), {name:f.name.trim(), qty:num(f.qty), unit:f.unit, category:f.category, lowAt: f.lowAt === '' ? null : num(f.lowAt), ...(f.foodId ? {foodId:f.foodId} : {})}); toast(`${f.name.trim()} added.`); }

  },
  pstep: el => { const p = S.pantry[el.dataset.id]; const st = STEP[p.unit] || 1; patch('pantry', el.dataset.id, {qty: Math.max(0, Math.round((num(p.qty) + st*num(el.dataset.dir))*1000)/1000)}); },
